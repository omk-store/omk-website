<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMK Wolf Jacket 🐺 | Only My Kind</title>
<style>
  body {margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,Helvetica,sans-serif;background:#fff;color:#111}
  .container{max-width:900px;margin:0 auto;padding:20px}
  .gallery{display:flex;flex-direction:column;gap:16px}
  .gallery img{width:100%;border-radius:10px;display:none}
  .gallery img.active{display:block}
  select{padding:10px;border:1px solid #ccc;border-radius:6px;font-weight:600;margin-bottom:20px}
  h1{font-size:1.8rem;font-weight:900;margin:10px 0}
  .price{font-weight:700;font-size:1.2rem;color:#ff2d55;margin-bottom:10px}
  .desc{font-size:1rem;line-height:1.6;font-weight:500;margin-bottom:20px}
  .btn{display:inline-block;background:#ff2d55;color:#fff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:800;letter-spacing:.4px}
  .btn:hover{opacity:.9}
  a.back{display:inline-block;margin-top:25px;text-decoration:none;color:#111;font-weight:700}
</style>
</head>
<body>

<div class="container">
  <h1>OMK Wolf Jacket 🐺</h1>
  <div class="price">₦80,000</div>

  <label for="color">Choose color:</label>
  <select id="color" onchange="changeJacket()">
    <option value="black">Black Edition</option>
    <option value="brown">Brown Edition</option>
  </select>

  <div class="gallery">
    <img id="black" src="jacket-black.jpg" alt="OMK Wolf Jacket - Black" class="active">
    <img id="brown" src="jacket-brown-back.jpeg" alt="OMK Wolf Jacket - Brown">
  </div>

  <p class="desc" id="desc">Premium black jacket with OMK embroidery — designed for those who move with loyalty, truth, and wolf energy 🐺.</p>

  <a class="btn" id="buyBtn" href="https://wa.me/2347038112817?text=Hi%20OMK%20—%20I'm%20interested%20in%20the%20OMK%20Wolf%20Jacket%20(Black%20Edition)" target="_blank">Buy Now on WhatsApp</a>
  <br><a class="back" href="index.html">← Back to Store</a>
</div>

<script>
function changeJacket(){
  const color = document.getElementById('color').value;
  const black = document.getElementById('black');
  const brown = document.getElementById('brown');
  const desc = document.getElementById('desc');
  const btn = document.getElementById('buyBtn');

  if(color === 'brown'){
    black.classList.remove('active');
    brown.classList.add('active');
    desc.textContent = 'Premium brown jacket with bold OMK embroidery — made for those who walk with loyalty, truth, and legacy. 🐺';
    btn.href = 'https://wa.me/2347038112817?text=Hi%20OMK%20—%20I%27m%20interested%20in%20the%20OMK%20Wolf%20Jacket%20(Brown%20Edition)';
  } else {
    brown.classList.remove('active');
    black.classList.add('active');
    desc.textContent = 'Premium black jacket with OMK embroidery — designed for those who move with loyalty, truth, and wolf energy 🐺.';
    btn.href = 'https://wa.me/2347038112817?text=Hi%20OMK%20—%20I%27m%20interested%20in%20the%20OMK%20Wolf%20Jacket%20(Black%20Edition)';
  }
}
</script>

</body>
</html>
