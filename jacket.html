<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Wolf Jacket 🐺 | Only My Kind</title>

<style>
  :root{
    --accent:#ff2d55;
    --bg1:#f9f9f9;
    --bg2:#ffffff;
    --text:#111;
  }

  body{
    margin:0;
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--text);
    overflow-x:hidden;
  }

  /* ===== HEADER ===== */
  header{
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter:blur(10px);
    background:rgba(255,255,255,0.8);
    border-bottom:1px solid rgba(0,0,0,0.05);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.05);
  }
  .brand{
    font-weight:900;
    letter-spacing:1px;
    font-size:1.1rem;
  }
  nav a{
    text-decoration:none;
    color:#111;
    margin-left:20px;
    font-weight:600;
    transition:.2s;
  }
  nav a:hover{
    color:var(--accent);
  }

  /* ===== MAIN ===== */
  .container{
    max-width:950px;
    margin:auto;
    padding:40px 18px;
    text-align:center;
  }

  h1{
    font-size:2.4rem;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(90deg,#ffd87a,#ff2d55,#ff6b6b,#ffd87a);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:glow 6s ease-in-out infinite;
  }
  @keyframes glow{
    0%{background-position:0%}
    50%{background-position:100%}
    100%{background-position:0%}
  }

  .gallery{
    display:flex;
    flex-direction:column;
    gap:18px;
    align-items:center;
  }
  .gallery img{
    width:100%;
    max-width:480px;
    border-radius:16px;
    box-shadow:0 12px 30px rgba(0,0,0,0.08);
    transition:transform .3s ease;
  }
  .gallery img:hover{
    transform:scale(1.02);
  }

  .price{
    font-weight:800;
    font-size:1.6rem;
    color:var(--accent);
    margin:20px 0 10px;
  }

  .selectors{
    background:#fff;
    border:1px solid #eee;
    border-radius:16px;
    padding:22px;
    margin-top:20px;
    box-shadow:0 6px 20px rgba(0,0,0,0.05);
  }

  select{
    padding:12px 16px;
    border-radius:10px;
    border:1px solid #ccc;
    font-weight:600;
    margin-bottom:20px;
    width:60%;
    max-width:280px;
  }

  .sizes{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
  }
  .sizes button{
    padding:10px 18px;
    border-radius:10px;
    border:1px solid #111;
    background:#fff;
    font-weight:700;
    cursor:pointer;
    transition:all .2s ease;
  }
  .sizes button:hover{
    background:#111;
    color:#fff;
  }

  .cta{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-weight:800;
    padding:16px 34px;
    border-radius:12px;
    margin-top:28px;
    text-decoration:none;
    box-shadow:0 6px 22px rgba(255,45,85,0.4);
    transition:.3s ease;
  }
  .cta:hover{
    transform:scale(1.05);
    box-shadow:0 8px 26px rgba(255,45,85,0.6);
  }

  footer{
    margin-top:70px;
    padding:25px;
    background:#111;
    color:#fff;
    font-weight:600;
    border-top:2px solid var(--accent);
  }

</style>
</head>
<body>

<header>
  <div class="brand">OMK</div>
  <nav>
    <a href="index.html">Shop</a>
    <a href="signup.html">Register</a>
    <a href="#buy">Buy</a>
  </nav>
</header>

<main class="container">
  <h1>OMK Wolf Jacket 🐺</h1>

  <div class="gallery">
    <img id="frontImg" src="IMG_9808.jpeg" alt="OMK Wolf Jacket - Front">
    <img id="backImg" src="B5F27213-CEA6-4B2C-9B7A-5303BDD6BE67.png" alt="OMK Wolf Jacket - Back">
  </div>

  <div class="price">₦80,000</div>

  <div class="selectors">
    <div>
      <label for="color"><strong>Color:</strong></label><br>
      <select id="color" onchange="changeColor(this.value)">
        <option value="brown" selected>Brown Edition</option>
        <option value="black">Black Edition</option>
      </select>
    </div>

    <div class="sizes">
      <button>S</button><button>M</button><button>L</button>
      <button>XL</button><button>2XL</button><button>3XL</button>
    </div>
  </div>

  <a id="buy" class="cta" href="https://wa.me/2347038112817?text=I'm%20interested%20in%20the%20OMK%20Wolf%20Jacket%20-%20Brown%20Edition" target="_blank">Buy Now on WhatsApp</a>
</main>

<footer>
  © 2025 OMK – Only My Kind | Loyalty • Truth • Legacy
</footer>

<script>
function changeColor(value){
  const front=document.getElementById('frontImg');
  const back=document.getElementById('backImg');
  const buy=document.getElementById('buy');
  if(value==='black'){
    front.src='A75E8E23-8F17-4FDC-901D-08CA00F9F066.png';
    back.src='81BB2C98-5614-46C6-A620-22728817B41F.png';
    buy.href='https://wa.me/2347038112817?text=I%27m%20interested%20in%20the%20OMK%20Wolf%20Jacket%20-%20Black%20Edition';
  }else{
    front.src='IMG_9808.jpeg';
    back.src='B5F27213-CEA6-4B2C-9B7A-5303BDD6BE67.png';
    buy.href='https://wa.me/2347038112817?text=I%27m%20interested%20in%20the%20OMK%20Wolf%20Jacket%20-%20Brown%20Edition';
  }
}
</script>

</body>
</html>
