<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Wolf Jacket 🐺</title>
<style>
  :root{
    --fg:#111;--bg:#fff;--muted:#6b6b6b;--accent:#7a33ff;--accent2:#ff2d55;
    --chip:#f4ecff;--chip-border:#d7c7ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Arial,Helvetica,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:22px 16px 40px}

  /* header (same on every page) */
  .site-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eee;
    display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
  .brand{font-weight:900;font-size:22px;color:#6320ee;text-decoration:none;border-bottom:3px solid #6320ee}
  .actions{display:flex;gap:10px}
  .icon{border:1px solid #eee;border-radius:14px;padding:10px 12px}

  h1{font-size:clamp(24px,4.8vw,38px);margin:12px 0 6px;font-weight:900}
  .price{color:#ff2d55;font-weight:900;font-size:1.6rem;margin:6px 0 12px}

  /* selector – “2030” chip look */
  .picker{display:flex;align-items:center;gap:10px;margin:10px 0 18px}
  .picker label{font-weight:700}
  .select{
    position:relative;
    display:inline-flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:999px;background:var(--chip);
    border:1px solid var(--chip-border);font-weight:800;
  }
  .select select{
    appearance:none;background:transparent;border:0;outline:0;font:inherit;cursor:pointer;
  }
  .select:after{content:"▾";font-size:12px;opacity:.8}

  /* gallery */
  .gallery{display:grid;gap:14px}
  .card{
    background:#0f1115;color:#ddd;border-radius:16px;border:1px solid #20232b;
    display:flex;align-items:center;justify-content:center;min-height:260px;
  }
  .card img{width:100%;height:auto;border-radius:12px;display:block}
  .desc{margin-top:8px;font-weight:600;opacity:.8}

  .cta{display:inline-block;margin-top:18px;background:var(--accent2);color:#fff;
    padding:14px 24px;border-radius:12px;font-weight:900;text-decoration:none}
  .backlink{display:inline-block;margin-top:22px;font-weight:800;text-decoration:none;color:#111}
  @media(min-width:720px){.gallery{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">OMK</a>
  <div class="actions">
    <div class="icon">☰</div>
    <div class="icon">🛍️</div>
  </div>
</header>

<main class="wrap">
  <h1>OMK Wolf Jacket 🐺</h1>
  <div class="price">₦80,000</div>

  <div class="picker">
    <label for="color">Choose color:</label>
    <div class="select">
      <select id="color">
        <option value="brown" selected>Brown Edition</option>
        <option value="black">Black Edition</option>
      </select>
    </div>
  </div>

  <!-- Two images shown at once (front + back) -->
  <section class="gallery">
    <div class="card">
      <img id="imgFront" src="omk-brown-front.png?v=2" alt="OMK Wolf Jacket - Front">
    </div>
    <div class="card">
      <img id="imgBack" src="omk-brown-back.png?v=2" alt="OMK Wolf Jacket - Back">
    </div>
  </section>

  <p class="desc">
    Premium jacket with bold OMK embroidery — made for those who walk with loyalty, truth, and wolf energy. 🐺
  </p>

  <a class="cta" id="buyBtn" target="_blank"
     href="https://wa.me/2347038112817?text=Hi%20OMK%20—%20I%27m%20interested%20in%20the%20OMK%20Wolf%20Jacket%20(Brown%20Edition).">
     Buy Now on WhatsApp
  </a><br>
  <a class="backlink" href="index.html">← Back to Store</a>
</main>

<script>
  // swap images + button text when color changes
  const colorSel = document.getElementById('color');
  const imgFront = document.getElementById('imgFront');
  const imgBack  = document.getElementById('imgBack');
  const buyBtn   = document.getElementById('buyBtn');

  function setColor(c){
    if(c==='black'){
      imgFront.src = 'omk-black-front.png?v=2';
      imgBack.src  = 'omk-black-back.png?v=2';
      buyBtn.href  = 'https://wa.me/2347038112817?text='+
        encodeURIComponent("Hi OMK — I'm interested in the OMK Wolf Jacket (Black Edition).");
    }else{
      imgFront.src = 'omk-brown-front.png?v=2';
      imgBack.src  = 'omk-brown-back.png?v=2';
      buyBtn.href  = 'https://wa.me/2347038112817?text='+
        encodeURIComponent("Hi OMK — I'm interested in the OMK Wolf Jacket (Brown Edition).");
    }
  }
  colorSel.addEventListener('change', e=> setColor(e.target.value));
  setColor(colorSel.value); // set default on load
</script>
</body>
</html>
