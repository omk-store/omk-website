<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Wolf Jacket 🐺 | Only My Kind</title>

<style>
  body{font-family:'Poppins',system-ui,sans-serif;margin:0;padding:0;background:#fff;color:#111;text-align:center;}
  .container{max-width:900px;margin:auto;padding:30px 16px;}
  h1{font-size:1.9rem;font-weight:900;margin:10px 0;}
  .price{font-size:1.5rem;color:#ff2d55;font-weight:700;margin:5px 0 20px;}
  select{padding:10px 14px;font-size:1rem;border-radius:8px;border:1px solid #ccc;cursor:pointer;}
  .imgwrap img{width:100%;border-radius:12px;margin:14px 0;object-fit:cover;}
  .sizes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0;}
  .sizes button{padding:10px 16px;border:1px solid #111;background:#fff;font-weight:700;border-radius:8px;cursor:pointer;transition:.2s;}
  .sizes button:hover{background:#111;color:#fff;}
  .cta{display:inline-block;background:#ff2d55;color:#fff;font-weight:800;padding:14px 26px;border-radius:10px;text-decoration:none;box-shadow:0 4px 14px rgba(255,45,85,.4);transition:.3s;}
  .cta:hover{transform:scale(1.05);}
  footer{margin-top:40px;font-size:.85rem;color:#666;}
</style>
</head>
<body>

<div class="container">
  <h1>OMK Wolf Jacket 🐺</h1>
  <p class="price">₦80,000</p>

  <div class="imgwrap">
    <img id="frontImg" src="IMG_9808.jpeg" alt="OMK Wolf Jacket - Front">
    <img id="backImg" src="B5F27213-CEA6-4B2C-9B7A-5303BDD6BE67.png" alt="OMK Wolf Jacket - Back">
  </div>

  <div>
    <label for="color">Choose color:</label>
    <select id="color" onchange="changeColor(this.value)">
      <option value="brown" selected>Brown Edition</option>
      <option value="black">Black Edition</option>
    </select>
  </div>

  <div class="sizes">
    <button>S</button>
    <button>M</button>
    <button>L</button>
    <button>XL</button>
    <button>2XL</button>
    <button>3XL</button>
  </div>

  <a class="cta" id="buyNow" href="https://wa.me/2347038112817?text=I'm%20interested%20in%20the%20OMK%20Wolf%20Jacket%20-%20Brown%20Edition" target="_blank">Buy Now on WhatsApp</a>

  <footer>Premium jacket with OMK embroidery — made for those who walk with loyalty, truth & wolf energy 🐺</footer>
</div>

<script>
function changeColor(value){
  const front=document.getElementById('frontImg');
  const back=document.getElementById('backImg');
  const buy=document.getElementById('buyNow');
  if(value==='black'){
    front.src='A75E8E23-8F17-4FDC-901D-08CA00F9F066.png';
    back.src='81BB2C98-5614-46C6-A620-22728817B41F.png';
    buy.href='https://wa.me/2347038112817?text=I%27m%20interested%20in%20the%20OMK%20Wolf%20Jacket%20-%20Black%20Edition';
  }else{
    front.src='IMG_9808.jpeg';
    back.src='B5F27213-CEA6-4B2C-9B7A-5303BDD6BE67.png';
    buy.href='https://wa.me/2347038112817?text=I%27m%20interested%20in%20the%20OMK%20Wolf%20Jacket%20-%20Brown%20Edition';
  }
}
</script>
</body>
</html>
