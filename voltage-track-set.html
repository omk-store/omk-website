<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Voltage Track Set ⚡ | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer;transition:.3s}
.h-icons img:hover{opacity:.7}

/* PAGE */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{display:grid;gap:34px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  align-items:start;
}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:14px}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{width:100%;border-radius:14px;border:1px solid var(--border);
  object-fit:contain;transition:.2s}

/* COLORS */
.colors{display:flex;gap:10px;margin:10px 0}
.color-btn{
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  border:2px solid #e5e7eb;transition:.2s;
}
.color-btn.active{border-color:#111;transform:scale(1.1)}

/* TEXT */
.title{font-size:28px;font-weight:900;margin:6px 0 10px}
.desc{color:var(--muted);line-height:1.7;margin-bottom:14px}
.price{font-weight:900;font-size:20px;margin:6px 0 18px}
.subtle{font-size:13px;color:var(--muted)}

.sizes{display:flex;gap:10px;margin:10px 0 4px}
.size{padding:10px 16px;border:1px solid var(--border);
  border-radius:10px;font-weight:800;cursor:pointer;background:#fff}
.size.active{background:#111;color:#fff;border-color:#111}

.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:12px;border:1px solid var(--border);
  font-weight:900;cursor:pointer;background:#fff;
}
.btn.primary{background:#111;color:#fff;border-color:#111}
.btn:active{transform:translateY(1px)}

footer{margin:60px 0 90px;text-align:center;color:var(--muted);font-weight:600}
footer a{font-weight:800}

.wa{position:fixed;right:16px;bottom:90px;z-index:300;background:#fff;
  border:1px solid var(--border);border-radius:999px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);
  font-weight:900;}
.wa img{width:18px;height:18px}
.dot{width:8px;height:8px;background:var(--omk);border-radius:50%}
</style>
</head>

    </div>
