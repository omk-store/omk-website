<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Blue-Line Tee 👕 | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer;transition:.3s}
.h-icons img:hover{opacity:.7}

/* PAGE */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{
  display:grid;gap:34px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  align-items:start;
}

/* PRODUCT CARD */
.card{
  background:#fff;border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:14px
}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{
  width:100%;border-radius:14px;border:1px solid var(--border);object-fit:contain;
}
.title{font-size:28px;font-weight:900;margin:6px 0 10px}
.desc{color:var(--muted);line-height:1.7;margin-bottom:14px}
.price{font-weight:900;font-size:20px;margin:6px 0 18px}
.subtle{font-size:13px;color:var(--muted)}
.sizes{display:flex;gap:10px;margin:10px 0 4px}
.size{
  padding:10px 16px;border:1px solid var(--border);
  border-radius:10px;font-weight:800;cursor:pointer;background:#fff
}
.size.active{background:#111;color:#fff;border-color:#111}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:12px;border:1px solid var(--border);
  font-weight:900;cursor:pointer;background:#fff;
}
.btn.primary{background:#111;color:#fff;border-color:#111}
.btn:active{transform:translateY(1px)}

footer{
  margin:60px 0 90px;text-align:center;color:var(--muted);
  font-weight:600
}
footer a{font-weight:800}

/* WHATSAPP CHAT */
.wa{
  position:fixed;right:16px;bottom:90px;z-index:300;background:#fff;
  border:1px solid var(--border);border-radius:999px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);
  font-weight:900;
}
.wa img{width:18px;height:18px}
.dot{width:8px;height:8px;background:var(--omk);border-radius:50%}
</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>
  <div class="h-icons">
    <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png">
    <img src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<main class="wrap">
  <section class="grid">

    <!-- PRODUCT IMAGES -->
    <div class="card">
      <div class="gallery">

        <!-- FRONT -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/42CB264F-3EDC-4B58-A10E-556BDEE31F93.png" 
             alt="OMK Blue-Line Tee — Front">

        <!-- BACK -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/28541704-6980-4D74-8ABF-4145A746F4CA.png" 
             alt="OMK Blue-Line Tee — Back">

      </div>
    </div>

    <!-- PRODUCT DETAILS -->
    <div class="card">
      <div class="title">OMK Blue-Line Tee 👕</div>

      <div class="desc">
        Premium OMK Blue-Line T-Shirt with clean line detailing,
        sharp silhouette and wolf-energy presence. 
      </div>

      <div class="price">₦60,000</div>

      <div class="subtle">Size</div>
      <div class="sizes" id="sizes">
        <button class="size">S</button>
        <button class="size active">M</button>
        <button class="size">L</button>
        <button class="size">XL</button>
      </div>

      <div class="btns">
        <button class="btn">Add to Cart</button>
        <a class="btn primary" href="checkout.html">Buy Now</a>
      </div>

      <p class="subtle" style="margin-top:14px">
        Blue-Line • Wolf Tribe • OMK Drip
      </p>
    </div>

  </section>
</main>

<footer>
  © 2025 <strong>OMK – Only My Kind</strong> · All Rights Reserved<br>
  <span>Contact: omkdrip@gmail.com</span>
</footer>

<!-- WhatsApp -->
<a class="wa" target="_blank"
href="https://wa.me/2348118618722?text=Hi%20OMK%2C%20I%20want%20to%20order%20the%20Blue-Line%20Tee">
  <span class="dot"></span>
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
  <span>Chat with us</span>
</a>

</body>
</html>
