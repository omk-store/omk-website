<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Blue-Line Tee 👕 | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer}

/* CART ICON */
.cart-btn{position:relative;cursor:pointer}
.cart-count{
  position:absolute;top:-4px;right:-6px;background:var(--omk);color:#fff;
  font-size:11px;font-weight:700;border-radius:50%;width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;display:none;
}

/* PAGE */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{
  display:grid;gap:34px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  align-items:start;
}

/* CARDS */
.card{
  background:#fff;border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--shadow);padding:14px;
}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{
  width:100%;border-radius:14px;border:1px solid var(--border);
  object-fit:contain;
}

/* TEXT */
.title{font-size:28px;font-weight:900;margin:6px 0 10px}
.desc{color:var(--muted);line-height:1.7;margin-bottom:14px}
.price{font-weight:900;font-size:20px;margin:6px 0 18px}
.subtle{font-size:13px;color:var(--muted)}

/* SIZES */
.sizes{display:flex;gap:10px;margin:10px 0 4px}
.size{
  padding:10px 16px;border:1px solid var(--border);
  border-radius:10px;font-weight:800;cursor:pointer;background:#fff;
}
.size.active{background:#111;color:#fff;border-color:#111}

/* BUTTONS */
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 18px;border-radius:12px;border:1px solid var(--border);
  font-weight:900;cursor:pointer;background:#fff;
}
.btn.primary{background:#111;color:#fff;border-color:#111}

/* CART DRAWER */
.cart-drawer-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.3);display:none;z-index:9000;
}
.cart-drawer{
  position:fixed;right:0;top:0;width:300px;height:100%;
  background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.15);
  transform:translateX(100%);transition:.35s;z-index:9999;
  padding:20px;display:flex;flex-direction:column;
}
.cart-drawer.open{transform:translateX(0)}
.cart-title{font-weight:900;font-size:18px;margin-bottom:16px}
.cart-items{flex:1;overflow-y:auto}
.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid #eee;
}
.remove-btn{cursor:pointer;font-size:20px;font-weight:900;color:#333}
.checkout-btn{
  padding:12px 16px;background:#111;color:#fff;border-radius:10px;
  text-align:center;font-weight:900;margin-top:14px;display:block;
}

/* FOOTER */
footer{
  margin:60px 0 90px;text-align:center;color:var(--muted);font-weight:600;
}

/* CHAT */
.chat-btn{
  position:fixed;right:18px;bottom:20px;z-index:2000;
  background:#fff;border:1px solid var(--border);
  padding:10px 16px;border-radius:40px;display:flex;
  align-items:center;gap:8px;font-weight:800;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}
.chat-btn img{width:20px;height:20px}
.dot{width:8px;height:8px;background:var(--omk);border-radius:50%}
</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>
  <div class="h-icons">
    <div class="cart-btn" id="cartBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png">
      <div id="cartCount" class="cart-count">0</div>
    </div>
    <img id="menuBtn" src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<main class="wrap">
  <section class="grid">

    <!-- IMAGES -->
    <div class="card">
      <div class="gallery">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/42CB264F-3EDC-4B58-A10E-556BDEE31F93.png">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/28541704-6980-4D74-8ABF-4145A746F4CA.png">
      </div>
    </div>

    <!-- DETAILS -->
    <div class="card">

      <div class="title">OMK Blue-Line Tee 👕</div>

      <div class="desc">
        Premium OMK Blue-Line T-Shirt with clean line detailing, sharp silhouette, and wolf-energy presence.
      </div>

      <div class="price">₦60,000</div>

      <div class="subtle">Size</div>
      <div class="sizes" id="sizes">
        <button class="size">S</button>
        <button class="size active">M</button>
        <button class="size">L</button>
        <button class="size">XL</button>
      </div>

      <div class="btns">
        <button class="btn" id="addToCart">Add to Cart</button>
        <a class="btn primary" href="checkout.html">Buy Now</a>
      </div>

      <p class="subtle" style="margin-top:14px">
        Blue-Line • Wolf Tribe • OMK Drip
      </p>

    </div>

  </section>
</main>

<!-- CART DRAWER -->
<div class="cart-drawer-bg" id="drawerBg"></div>

<div class="cart-drawer" id="drawer">
  <div class="cart-title">Your Cart</div>
  <div class="cart-items" id="cartItems"></div>
  <a href="checkout.html" class="checkout-btn">Checkout</a>
</div>

<footer>
  © 2025 <strong>OMK – Only My Kind</strong> · All Rights Reserved
  <br>Contact: omkdrip@gmail.com
</footer>

<a class="chat-btn" target="_blank"
href="https://wa.me/2347078276236?text=Hi%20OMK%2C%20I%20want%20to%20order%20the%20Blue-Line%20Tee">
  <span class="dot"></span>
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
  <span>Chat with us</span>
</a>

<script>
// SIZE SELECTOR
const sizes=document.querySelectorAll('.size');
sizes.forEach(btn=>{
  btn.addEventListener('click',()=>{
    sizes.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// CART SYSTEM
let cart=JSON.parse(localStorage.getItem('omkCart')||'[]');
updateCart();

document.getElementById('cartBtn').onclick=openDrawer;
document.getElementById('drawerBg').onclick=closeDrawer;

function openDrawer(){
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBg').style.display='block';
  renderCart();
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBg').style.display='none';
}

function addToCart(){
  const size=document.querySelector('.size.active')?.textContent||'M';
  cart.push({name:`Blue-Line Tee (${size})`,price:60000});
  localStorage.setItem('omkCart',JSON.stringify(cart));
  updateCart();
  openDrawer();
}

function updateCart(){
  const count=document.getElementById('cartCount');
  count.textContent=cart.length;
  count.style.display=cart.length?'flex':'none';
}

function renderCart(){
  const box=document.getElementById('cartItems');
  box.innerHTML='';
  cart.forEach((item,i)=>{
    box.innerHTML+=`
      <div class="cart-item">
        <span>${item.name}</span>
        <span class="remove-btn" onclick="removeItem(${i})">&times;</span>
      </div>
    `;
  });
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem('omkCart',JSON.stringify(cart));
  updateCart();
  renderCart();
}

document.getElementById('addToCart').onclick=addToCart;
</script>

</body>
</html>
