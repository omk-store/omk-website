<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Voltage Jacket ⚡ | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{
  position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);
  padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  z-index:20;
}
.brand{font-size:22px;font-weight:900}

/* PAGE WRAP */
.wrap{max-width:1100px;margin:30px auto;padding:0 18px}
.gallery{display:flex;flex-direction:column;gap:20px}
.gallery img{
  width:100%;border-radius:14px;border:1px solid var(--border);
  object-fit:contain;box-shadow:var(--shadow);
}

/* PRODUCT DETAILS */
.title{font-size:30px;font-weight:900;margin-top:10px}
.desc{color:var(--muted);margin:14px 0 18px;line-height:1.7}
.price{font-size:24px;font-weight:900;margin-bottom:14px}
.size-btns{display:flex;gap:10px;margin:14px 0}
.size{padding:12px 18px;border:1px solid var(--border);border-radius:10px;font-weight:800;cursor:pointer}
.size.active{background:#000;color:#fff;border-color:#000}

.btn-area{display:flex;gap:14px;margin:20px 0}
.btn{
  padding:14px 20px;border-radius:12px;border:1px solid #000;
  font-weight:900;cursor:pointer;
}
.btn.primary{background:#000;color:#fff}

/* FOOTER */
footer{text-align:center;margin:60px 0 90px;color:#555;font-weight:600}

</style>
</head>

<body>

<header class="header">
  <a href="index.html" class="brand">OMK</a>
</header>

<div class="wrap">

  <div class="gallery">
    <!-- Jacket FRONT -->
    <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/4F6463CE-AC93-46AC-9E46-24CFC46DEE4C.png" alt="OMK Voltage Jacket — Front">

    <!-- Jacket BACK (FIXED) -->
    <img src="/mnt/data/0223BE1E-1646-4688-A36C-64BA9463E542.jpeg" alt="OMK Voltage Jacket — Back">
  </div>

  <h1 class="title">OMK Voltage Jacket ⚡</h1>

  <p class="price">₦90,000</p>

  <p class="desc">
    Premium Voltage Collection jacket. Clean, sharp, and crafted for the chosen ones — built with the OMK 2030 streetwear energy.
  </p>

  <div class="size-btns">
    <div class="size active">M</div>
    <div class="size">L</div>
    <div class="size">XL</div>
  </div>

  <div class="btn-area">
    <a href="checkout.html" class="btn primary">Order Now</a>
    <a href="https://wa.me/2347038112817?text=Hi%20OMK%2C%20I%20want%20the%20Voltage%20Jacket" class="btn">Chat on WhatsApp</a>
  </div>

</div>

<footer>© 2025 OMK — Only My Kind</footer>

</body>
</html>
