<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Voltage Jacket ⚡ | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px}
.header-icons{display:flex;gap:14px;align-items:center}
.header-icons img{width:24px;height:24px;cursor:pointer}

/* PAGE WRAP */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{
  display:grid;gap:34px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  align-items:start;
}

.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{
  width:100%;border-radius:14px;border:1px solid var(--border);object-fit:contain;
}

.title{font-size:28px;font-weight:900;margin:6px 0 10px}
.desc{color:var(--muted);line-height:1.7;margin-bottom:14px}
.price{font-weight:900;font-size:22px;margin:10px 0}

.sizes{display:flex;gap:10px;margin-top:12px}
.size{padding:10px 16px;border:1px solid var(--border);border-radius:10px;font-weight:800;cursor:pointer;background:#fff}
.size.active{background:#111;color:#fff;border-color:#111}

.btns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.btn{
  padding:14px 18px;border-radius:12px;border:1px solid var(--border);font-weight:900;cursor:pointer;background:#fff;
}
.btn.primary{background:#111;color:#fff;border-color:#111}

/* FOOTER */
footer{text-align:center;margin:60px 0 90px;color:var(--muted);font-weight:600}
footer a{font-weight:800}

/* WHATSAPP */
.wa{
  position:fixed;right:18px;bottom:90px;background:#fff;border:1px solid var(--border);
  border-radius:40px;padding:10px 14px;display:flex;align-items:center;gap:8px;
  font-weight:900;box-shadow:0 0 20px rgba(0,0,0,.1);
}
.wa img{width:18px}
.dot{width:8px;height:8px;background:var(--omk);border-radius:50%}

</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>
  <div class="header-icons">
    <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png">
    <img src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<main class="wrap">
  <section class="grid">

    <!-- GALLERY -->
    <div class="card">
      <div class="gallery">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/4F6463CE-AC93-46AC-9E46-24CFC46DEE4C.png" alt="OMK Voltage Jacket — Front">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/A630FF9E-1251-4FD8-B2D0-330772C82B15.png" alt="OMK Voltage Jacket — Back">
      </div>
    </div>

    <!-- DETAILS -->
    <div class="card">
      <div class="title">OMK Voltage Jacket ⚡</div>
      <div class="desc">
        Premium OMK Voltage Jacket crafted with futuristic wave panels and signature Only My Kind energy.  
        Built for style, loyalty, and premium drip.
      </div>
      <div class="price">₦90,000</div>

      <div class="sizes">
        <button class="size active">M</button>
        <button class="size">L</button>
        <button class="size">XL</button>
        <button class="size">2XL</button>
      </div>

      <div class="btns">
        <button class="btn">Add to Cart</button>
        <a class="btn primary" href="checkout.html">Buy Now</a>
      </div>

      <p class="subtle" style="margin-top:14px;color:#6b7280">OMK Voltage Energy ⚡🐺</p>
    </div>

  </section>
</main>

  <span class="dot"></span>

  <span>Chat with us</span>

</body>
</html>
