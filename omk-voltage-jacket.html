<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Voltage Jacket ⚡ | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer}

/* PAGE LAYOUT */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{
  display:grid;
  gap:34px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  align-items:start;
}
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{
  width:100%;border-radius:14px;border:1px solid var(--border);object-fit:cover;
}
.title{font-size:28px;font-weight:900;margin:6px 0 10px}
.desc{color:var(--muted);line-height:1.6;margin-bottom:14px}
.price{font-size:22px;font-weight:900;margin-bottom:18px}
.btn{
  padding:14px 18px;
  font-weight:900;
  background:#111;color:#fff;
  border-radius:12px;
  border:none;
  cursor:pointer;
  width:100%;
  margin-top:14px;
}

/* FOOTER */
footer{text-align:center;margin:60px 0 90px;color:var(--muted);font-weight:600}
</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>
  <div class="h-icons">
    <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png">
    <img src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<main class="wrap">
  <section class="grid">
    
    <!-- IMAGE GALLERY -->
    <div class="card">
      <div class="gallery">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/4F6463CE-AC93-46AC-9E46-24CFC46DEE4C.png">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/9BBC37D7-695C-4650-AEE9-C04910FBDF28.png">
      </div>
    </div>

    <!-- PRODUCT DETAILS -->
    <div class="card">
      <div class="title">OMK Voltage Jacket ⚡</div>
      <div class="desc">
        Premium luxury streetwear jacket with signature OMK voltage curves.
        Midnight-blue wave panels, embroidered OMK chest, and perfect tailored fit.
        <br><br>
        Crafted for loyalty, drip & the wolf spirit 🐺⚡
      </div>

      <div class="price">₦90,000</div>

      <button class="btn">Buy Now</button>
    </div>

  </section>
</main>

<footer>
  © 2025 OMK — Only My Kind  
</footer>

</body>
</html>
