<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Voltage Jacket ⚡ | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer}

/* PAGE WRAP */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{
  display:grid;gap:34px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
}

/* CARD */
.card{background:#fff;border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:14px}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{width:100%;border-radius:14px;border:1px solid var(--border)}

.title{font-size:28px;font-weight:900;margin:10px 0}
.desc{color:var(--muted);line-height:1.7}
.price{font-size:22px;font-weight:900;margin-top:10px}

/* SIZES */
.sizes{display:flex;gap:10px;margin:10px 0}
.size{
  padding:10px 16px;border:1px solid var(--border);border-radius:10px;
  font-weight:800;background:#fff;cursor:pointer;
}
.size.active{background:#111;color:#fff;border-color:#111}

/* BUTTONS */
.btns{display:flex;gap:12px;margin-top:16px}
.btn{
  padding:14px 18px;background:#fff;border:1px solid var(--border);
  border-radius:12px;font-weight:900;cursor:pointer;text-align:center;
}
.btn.primary{background:#111;color:#fff;border-color:#111}
.btn:active{transform:translateY(1px)}

/* FOOTER */
footer{text-align:center;margin:60px 0;color:var(--muted);font-weight:600}
footer a{font-weight:800}

/* WHATSAPP */
.wa{
  position:fixed;right:16px;bottom:90px;background:#fff;
  border:1px solid var(--border);border-radius:999px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;font-weight:900;
  box-shadow:var(--shadow);z-index:300;
}
.wa img{width:18px;height:18px}
.dot{width:8px;height:8px;background:var(--omk);border-radius:50%}
</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>
  <div class="h-icons">
    <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png">
    <img src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<main class="wrap">
  <section class="grid">

    <!-- IMAGES -->
    <div class="card">
      <div class="gallery">
        <!-- FRONT -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/4F6463CE-AC93-46AC-9E46-24CFC46DEE4C.png" alt="OMK Voltage Jacket — Front">

        <!-- BACK (LOCAL UPLOAD WORKING) -->
        <img src="/mnt/data/0223BE1E-1646-4688-A36C-64BA9463E542.jpeg" alt="OMK Voltage Jacket — Back">
      </div>
    </div>

    <!-- DETAILS -->
    <div class="card">
      <div class="title">OMK Voltage Jacket ⚡</div>

      <div class="desc">
        Premium Voltage Collection jacket. Clean, sharp and built for the chosen ones — crafted with the OMK 2030 streetwear energy.
      </div>

      <div class="price">₦90,000</div>

      <div class="sizes">
        <button class="size active">M</button>
        <button class="size">L</button>
        <button class="size">XL</button>
      </div>

      <div class="btns">
        <button class="btn" onclick="alert('Added to Cart!')">Add to Cart</button>
        <a class="btn primary" href="checkout.html">Buy Now</a>
      </div>

    </div>

  </section>
</main>

  <span class="dot"></span>

</body>
</html>
