<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Voltage Jacket ⚡ | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:14px 20px;
}
.brand{font-weight:900;font-size:22px}

/* LAYOUT */
.wrap{max-width:1100px;margin:30px auto;padding:0 16px}
.grid{
  display:grid;gap:30px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
}

/* CARD */
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{
  width:100%;border-radius:14px;border:1px solid var(--border);
  object-fit:contain;
}

/* INFO */
.title{font-size:30px;font-weight:900;margin:10px 0}
.price{font-size:22px;font-weight:900;margin:12px 0}
.desc{color:var(--muted);line-height:1.7}

/* SIZE */
.sizes{display:flex;gap:10px;margin-top:12px}
.size{
  padding:10px 18px;border:1px solid var(--border);border-radius:10px;
  font-weight:800;cursor:pointer;
}
.size.active{background:#111;color:#fff}

/* BUTTONS */
.btns{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.btn{
  padding:14px 18px;border-radius:12px;border:1px solid var(--border);
  font-weight:900;background:#fff;cursor:pointer;
}
.btn.primary{background:#111;color:#fff;border-color:#111}
</style>
</head>

<body>

<header class="header">
  <a class="brand" href="index.html">OMK</a>
</header>

<main class="wrap">
  <section class="grid">

    <!-- IMAGES -->
    <div class="card">
      <div class="gallery">

        <!-- FRONT IMAGE -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/4F6463CE-AC93-46AC-9E46-24CFC46DEE4C.png" alt="OMK Voltage Jacket — Front">

        <!-- BACK IMAGE (YOUR LOCAL FILE) -->
        <img src="/mnt/data/0223BE1E-1646-4688-A36C-64BA9463E542.jpeg" alt="OMK Voltage Jacket — Back">

      </div>
    </div>

    <!-- PRODUCT INFO -->
    <div class="card">
      <div class="title">OMK Voltage Jacket ⚡</div>
      <div class="desc">
        Premium Voltage Collection jacket. Clean, sharp, and built for the chosen ones —
        crafted with the OMK 2030 streetwear energy.
      </div>

      <div class="price">₦90,000</div>

      <div style="margin-top:10px;font-weight:700;color:#555">Size</div>
      <div class="sizes">
        <button class="size active">M</button>
        <button class="size">L</button>
        <button class="size">XL</button>
      </div>

      <div class="btns">
        <button class="btn">Add to Cart</button>
        <a class="btn primary" href="checkout.html">Order Now</a>
      </div>
    </div>

  </section>
</main>

<footer style="margin:50px 0;text-align:center;color:#777;font-size:14px">
  © 2025 OMK — Only My Kind
</footer>

</body>
</html>
