<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>If Earth Could Talk | Omo Taker</title>

<style>
:root{
  --bg:#000;
  --card:#ffffff;
  --text:#0a0a0a;
  --muted:#5c5c5c;
  --line:#ececec;
  --shadow:0 30px 80px rgba(0,0,0,.9);

  --radius:26px;
  --spotify:#0b0b0b;
  --dark:#0b0b0b;
  --ig:#e1306c;
  --tiktok:#0b0b0b;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}

body{
  min-height:100vh;
  background:var(--bg);
  padding:30px 18px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wrap{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  text-align:center;
}

/* BRAND */
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:14px;
}

.brand .logo{
  width:44px;height:44px;border-radius:12px;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

.brand .logo img{
  width:100%;height:100%;object-fit:cover;
}

.brand .brandtext b{
  display:block;font-size:14px;
}

.brand .brandtext span{
  display:block;font-size:12px;color:var(--muted);
}

/* COVER */
.cover{
  width:100%;
  border-radius:18px;
  margin-bottom:14px;
}

h1{
  font-size:22px;
  font-weight:1000;
  letter-spacing:.5px;
}

.artist{
  font-size:13px;
  color:#444;
  margin-top:6px;
}

.status{
  font-size:13px;
  color:#0aa84f;
  margin:10px 0 18px;
  font-weight:700;
}

/* BUTTONS */
.platforms{
  display:grid;
  gap:12px;
}

.btn{
  text-decoration:none;
  border-radius:16px;
  padding:14px;
  font-weight:900;
  font-size:14px;
  letter-spacing:.6px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  min-height:54px;
}

.btn:active{transform:scale(.98);}

.icon{
  width:34px;height:34px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.12);
}

.icon img{width:18px;height:18px;}

.spotify{
  background:var(--spotify);
  color:#fff;
  border-color:var(--spotify);
}

.dark{
  background:var(--dark);
  color:#fff;
  border-color:var(--dark);
}

.footer{
  margin-top:16px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>
<div class="wrap">

  <!-- BRAND -->
  <div class="brand">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/main/omk-logo.png">
    </div>
    <div class="brandtext">
      <b>OMK Records</b>
      <span>Official link</span>
    </div>
  </div>

  <!-- COVER -->
  <img
    src="https://raw.githubusercontent.com/omk-store/omk-website/main/27475981-5AEA-4007-BC96-AA39B96FCC87.png"
    class="cover"
    alt="If Earth Could Talk Cover"
  >

  <h1>IF EARTH COULD TALK</h1>
  <div class="artist">Omo Taker • OMK Records</div>
  <div class="status">Out Now 🌍</div>

  <div class="platforms">

    <!-- SPOTIFY FIRST -->
    <a class="btn spotify"
       href="https://open.spotify.com/track/7mifEtIK9OPGWD9EyOOLnq?si=0sQivtDWRvm6Oytb57phdg"
       target="_blank">
      <span class="icon">
        <img src="https://cdn.simpleicons.org/spotify/ffffff">
      </span>
      PLAY ON SPOTIFY
    </a>

    <!-- BOOMPLAY -->
    <a class="btn dark"
       href="https://www.boomplay.com/share/music/240458081?srModel=COPYLINK&share_content=music&share_channel=copylink&share_platform=ios&srList=IOS"
       target="_blank">
      <span class="icon">
        <img src="https://cdn.simpleicons.org/musicbrainz/ffffff">
      </span>
      STREAM ON BOOMPLAY
    </a>

    <!-- AUDIOMACK -->
    <a class="btn dark"
       href="https://audiomack.com/iam_omotaker/song/if-earth-could-talk?share-user-id=111838460"
       target="_blank">
      <span class="icon">
        <img src="https://cdn.simpleicons.org/audiomack/ffffff">
      </span>
      STREAM ON AUDIOMACK
    </a>

  </div>

  <div class="footer">© 2026 Omo Taker • OMK Records</div>

</div>
</body>
</html>
