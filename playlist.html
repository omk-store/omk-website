<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMK Playlist | Everyday Vibe</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}

body{
  background:#0b0b0f;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.wrap{
  width:100%;
  max-width:460px;
  background:#121218;
  border-radius:26px;
  padding:22px;
  border:1px solid #1e1f29;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.hero{
  width:100%;
  border-radius:18px;
  margin-bottom:16px;
}

h1{
  font-size:24px;
  font-weight:900;
  margin-bottom:6px;
}

.sub{
  color:#9aa0b2;
  font-size:14px;
  margin-bottom:20px;
}

.platforms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:22px;
}

.platform{
  border-radius:14px;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.platform:hover{transform:translateY(-3px);}

.spotify{background:#1db954;}
.apple{background:#ff2d55;}

.platform img{width:22px;}

.submit{
  margin-top:18px;
  border-top:1px solid #1e1f29;
  padding-top:18px;
}

input,textarea{
  width:100%;
  background:#0b0b0f;
  border:1px solid #1e1f29;
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
  color:#fff;
}

button{
  width:100%;
  padding:14px;
  border-radius:999px;
  border:none;
  font-weight:900;
  background:#5ef1ff;
  color:#000;
  cursor:pointer;
}

footer{
  text-align:center;
  margin-top:14px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="wrap">

<img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/e8276376-add6-461f-90a3-7da501d2a6c7.jpeg" class="hero">

<h1>EVERYDAY VIBE PLAYLIST</h1>
<div class="sub">Listen first. Then submit your song.</div>

<div class="platforms">
  <div class="platform spotify" onclick="openLink('https://open.spotify.com')">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
    Spotify
  </div>

  <div class="platform apple" onclick="openLink('https://music.apple.com')">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Apple_Music_logo.svg">
    Apple Music
  </div>
</div>

<div class="submit">
<h3 style="margin-bottom:10px;">Submit your song</h3>

<input id="artist" placeholder="Artist name" required>
<input id="title" placeholder="Song title" required>
<input id="link" placeholder="Song link" required>
<textarea id="msg" placeholder="Message (optional)"></textarea>

<button onclick="submitSong()">Submit</button>
</div>

<footer>
© 2026 OMK Playlist
</footer>

</div>

<script>
function openLink(url){
  window.open(url,'_blank');
}

function submitSong(){
  const artist=document.getElementById('artist').value;
  const title=document.getElementById('title').value;
  const link=document.getElementById('link').value;
  const msg=document.getElementById('msg').value;

  const email="activevibe65@gmail.com";

  window.location.href=`mailto:${email}?subject=Playlist Submission&body=Artist:%20${artist}%0ASong:%20${title}%0ALink:%20${link}%0AMessage:%20${msg}`;
}
</script>

</body>
</html>
