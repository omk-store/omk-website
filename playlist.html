<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Everyday Vibe Playlist | Listen & Submit</title>
<meta name="theme-color" content="#0b0b0f" />
<meta name="description" content="Everyday Vibe Playlist — Listen first. Then submit your song for placement or campaigns." />

<!-- (ALL YOUR CSS ABOVE REMAINS EXACTLY THE SAME) -->
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="hero">
        <div class="cover">
          <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/e8276376-add6-461f-90a3-7da501d2a6c7.jpeg" alt="Everyday Vibe">
        </div>

        <div class="title">EVERYDAY VIBE PLAYLIST</div>
        <div class="sub">Listen first. Then submit your song for playlist placement or campaigns.</div>
      </div>

      <!-- LISTEN BUTTONS -->
      <div class="row">
        <!-- SPOTIFY -->
        <a class="btn spotify"
           id="spotifyBtn"
           href="https://open.spotify.com/playlist/1Ox7VYqq4rFq1gYPPRP8Fh"
           target="_blank"
           rel="noopener">
          Spotify
        </a>

        <!-- APPLE -->
        <a class="btn apple"
           id="appleBtn"
           href="https://music.apple.com/ng/playlist/active-vibe/pl.u-DdAN8l3TN2ANagg"
           target="_blank"
           rel="noopener">
          Apple Music
        </a>
      </div>

      <div class="divider"></div>

      <!-- EVERYTHING ELSE IN YOUR PAGE STAYS EXACTLY THE SAME -->

      <div class="footer">© 2026 Everyday Vibe Playlist</div>
    </div>
  </div>

<script>
  const WHATSAPP_NUMBER = "2348118618722";
  const EMAIL_TO = "activevibe65@gmail.com";

  function requestWhatsApp(service, price){
    const txt =
`EVERYDAY VIBE PLAYLIST REQUEST

Service: ${service}
Price: ${price}

Artist name:
Song title:
Song link (Spotify/Apple):

Extra message:`;
    const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(txt);
    window.open(url, "_blank");
  }

  function sendEmail(e){
    e.preventDefault();

    const artist = document.getElementById("artistName").value.trim();
    const title  = document.getElementById("songTitle").value.trim();
    const link   = document.getElementById("songLink").value.trim();
    const svc    = document.getElementById("servicePick").value.trim();
    const phone  = document.getElementById("phone").value.trim();
    const msg    = document.getElementById("message").value.trim();

    const subject = `Everyday Vibe Playlist Submission — ${artist} (${svc})`;
    const body =
`EVERYDAY VIBE PLAYLIST SUBMISSION

Service: ${svc}

Artist: ${artist}
Song title: ${title}
Song link: ${link}
Phone/WhatsApp: ${phone || "N/A"}

Message:
${msg || "N/A"}`;

    const mailto = `mailto:${EMAIL_TO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  }
</script>

</body>
</html>
