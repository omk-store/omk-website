<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK | Only My Kind</title>

<style>
:root { --border:#eaeaea; --accent:#ff2d55; --dark:#000; }
*{box-sizing:border-box;margin:0;padding:0;scroll-behavior:smooth}
body{
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:#111;background:#fff;
}
a{text-decoration:none;color:inherit;cursor:pointer}

/* HEADER */
header{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 20px;
}
.logo{font-weight:900;font-size:22px}
.header-icons{display:flex;align-items:center;gap:14px}
.icon-btn img{width:26px;height:26px;cursor:pointer}

/* HERO */
.hero{text-align:center;padding:36px 16px 0}
.hero img{
  width:min(420px,92%);
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.25);
}
.hero p{font-size:15px;color:#444;margin-top:10px}

/* SECTION */
.section{padding:56px 0}
.section h2{text-align:center;font-size:28px;margin-bottom:26px}
.grid{
  width:min(1100px,92%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:22px;
}

/* CARD */
.grid a{display:block;width:100%;height:100%;text-decoration:none;color:inherit;}
.card{
  border:1px solid var(--border);border-radius:12px;overflow:hidden;
  background:#fff;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.05);
  transition:.25s;cursor:pointer;position:relative;
}
.card:hover{transform:translateY(-4px)}
.card-img img{width:100%;height:300px;object-fit:cover}
.card-body{padding:14px}
.price{color:#444;font-weight:700}
.badge{
  position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;
  font-size:12px;font-weight:800;padding:6px 10px;border-radius:20px;
}

/* JOIN EMAIL */
.join{
  width:min(900px,92%);margin:40px auto;background:#f9f9f9;
  border:1px solid var(--border);border-radius:14px;padding:26px;text-align:center;
}
.join input{
  width:75%;padding:12px;border-radius:10px;border:1px solid var(--border);
}
.join button{
  margin-left:8px;padding:12px 20px;background:#000;color:#fff;
  font-weight:800;border-radius:10px;
}

/* SOCIAL */
.social-icons{text-align:center;margin:40px auto 20px;}
.social-icons img{
  width:42px;height:42px;margin:0 12px;transition:0.25s;
}

/* ABOUT */
#about{
  background:#111;color:#fff;text-align:center;
  padding:70px 20px;margin-top:40px;
}
#about p{max-width:700px;margin:auto;color:#ddd}

/* FOOTER */
footer{text-align:center;padding:20px;color:#666}

/* WHATSAPP */
.chat-btn{
  position:fixed;right:18px;bottom:18px;z-index:90;background:#fff;
  border:1px solid var(--border);border-radius:40px;padding:10px 16px;
  font-weight:900;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.chat-dot{width:10px;height:10px;background:var(--accent);border-radius:50%}
</style>
</head>

<body>
