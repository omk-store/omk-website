<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK | Only My Kind</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;scroll-behavior:smooth}
body{
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:#0e0f11;
  background:#fff;
  opacity:0;
  animation:fadeIn 1s ease forwards;
}
@keyframes fadeIn{to{opacity:1}}
a{text-decoration:none;color:inherit}

/* HEADER */
header{
  position:sticky;top:0;z-index:20;
  backdrop-filter:blur(8px);
  background:rgba(255,255,255,0.9);
  border-bottom:1px solid #eaeaea;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px;
}
.brand{display:flex;align-items:baseline;gap:8px;color:#111}
.logo{font-weight:900;letter-spacing:1px;font-size:22px;cursor:pointer}
.tag{font-weight:300;opacity:0.8;font-size:12px}
.nav a{color:#444;margin-left:18px;font-size:14px;opacity:0.9;transition:.2s}
.nav a:hover{opacity:1;color:#ff2d55}

/* HERO */
.hero{
  background:url('https://omkdrip.com/wolf-hero.jpg') center top/contain no-repeat;
  height:70vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  text-align:center;
  padding-bottom:40px;
}

/* SECTION */
.section{padding:60px 0}
.section h2{text-align:center;font-size:28px;margin-bottom:30px;font-weight:800}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:28px;
  width:min(1100px,92%);
  margin:0 auto;
}

/* CARD */
.card{
  background:#fff;
  border:1px solid #eaeaea;
  border-radius:12px;
  overflow:hidden;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  transition:transform .25s ease,box-shadow .25s ease;
}
.card:hover{transform:translateY(-5px);box-shadow:0 6px 20px rgba(0,0,0,0.1)}
.card-img{position:relative;overflow:hidden}
.card-img img{
  width:100%;height:320px;object-fit:cover;border-radius:10px;
  transition:opacity .4s ease;
}
.card-img img.back{position:absolute;top:0;left:0;opacity:0}
.card:hover .card-img img.front{opacity:0}
.card:hover .card-img img.back{opacity:1}
.card-body{padding:16px}
.card h3{margin:6px 0;font-size:16px;font-weight:700}
.price{font-weight:600;color:#444;margin-bottom:10px}
.buy-btn{
  display:inline-block;
  background:#ff2d55;
  color:#fff;
  padding:10px 18px;
  border-radius:8px;
  font-weight:700;
  box-shadow:0 0 15px rgba(255,45,85,0.5);
  transition:.3s ease;
}
.buy-btn:hover{
  background:#e5254a;
  box-shadow:0 0 30px rgba(255,45,85,0.8);
  transform:scale(1.05);
}

/* FOOTER */
footer{
  border-top:1px solid #222;
  background:#000;
  color:#f6c90e;
  padding:24px 0;
  text-align:center;
  font-weight:600;
  font-size:14px;
}
footer strong{color:#ff2d55}
</style>
</head>

<body>
<header>

  </div>
  <nav class="nav">
    <a href="#shop">Shop</a>
    <a href="https://instagram.com/whosomotaker" target="_blank">Instagram</a>
    <a href="https://tiktok.com/@omkdrip" target="_blank">TikTok</a>
    <a href="https://wa.me/2347038112817?text=Hi%20OMK%2C%20I%20want%20to%20order" target="_blank">WhatsApp</a>
  </nav>

  <div class="grid">
    <div class="card">

        <img src="https://omkdrip.com/jeans-back.jpg" class="back">
      </div>
      <div class="card-body">
        <h3>OMK Jeans</h3>

    <div class="card">

      </div>
    </div>

    <div class="card">
      <div class="card-img">

      </div>
    </div>

    <div class="card">

        <img src="https://omkdrip.com/shorts.jpg" class="front">

      </div>
      <div class="card-body">

  </div>
</section>

<footer>
  © 2025 <strong>OMK</strong> — Only My Kind | 2030 Collection 👑🐺🔥

</body>
</html>
