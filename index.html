<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK | Only My Kind</title>

<style>
:root { --fg:#111; --bg:#fff; --border:#eaeaea; --accent:#ff2d55; }
*{box-sizing:border-box;margin:0;padding:0;scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--fg);background:var(--bg)}
a{text-decoration:none;color:inherit;cursor:pointer}

/* HEADER */
header{
  position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 18px
}
.brand{display:flex;align-items:baseline;gap:8px}
.logo{font-weight:900;font-size:22px}
.tag{font-weight:300;opacity:.8;font-size:12px}
.nav{display:flex;align-items:center;gap:14px}
.nav a{font-weight:700;color:#444}
.nav a:hover{color:var(--accent)}
.icon-btn img{width:24px;height:24px;transition:.2s}
.icon-btn img:hover{opacity:.75}

/* HERO (Clean Wolf Image) */
.hero{
  background:url('5CB390F1-C296-439F-A95B-32679E9FE8BA.png') center top/contain no-repeat;
  height:100vh;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:60px;
  background-color:#000;
}

/* SECTIONS & GRID */
.section{padding:56px 0}
.section h2{text-align:center;font-size:28px;margin-bottom:26px}
.grid{
  width:min(1100px,92%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:22px;
}
.card{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
  transition:transform .25s,box-shadow .25s
}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.card-img{position:relative;overflow:hidden}
.card-img img{width:100%;height:300px;object-fit:cover;border-radius:10px;transition:opacity .35s ease}
.card-img img.back{position:absolute;inset:0;opacity:0}
.card:hover .card-img img.front{opacity:0}
.card:hover .card-img img.back{opacity:1}
.card-body{padding:14px}
.card h3{margin:6px 0 2px;font-size:16px;font-weight:800}
.price{color:#444;font-weight:700;margin-bottom:10px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;font-weight:800}
.btn:hover{opacity:.9}

/* FOOTER */
footer{
  border-top:1px solid var(--border);
  padding:22px 0;
  text-align:center;
  color:#666;
  font-weight:600;
}
footer img{transition:transform .25s}
footer a:hover img{transform:scale(1.12)}
</style>
</head>

<body>
<header>
  <div class="brand">
    <a href="#top" class="logo">OMK</a>
    <span class="tag">Only My Kind</span>
  </div>
  <nav class="nav">
    <a href="#shop">Shop</a>
    <a href="register.html">Register</a>
    <a href="login.html">Login</a>
    <a class="icon-btn" id="cartBtn" title="Open Bag">
      <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png" alt="bag">
    </a>
  </nav>
</header>

<section class="hero" id="top"></section>

<section id="shop" class="section">
  <h2>Latest Drop 🔥</h2>
  <div class="grid">
    <div class="card" data-name="OMK Wolf Jacket" data-price="80000" data-img="https://omkdrip.com/images/omk-jacket-front.png">
      <div class="card-img">
        <img class="front" src="https://omkdrip.com/images/omk-jacket-front.png">
        <img class="back" src="https://omkdrip.com/images/omk-jacket-back.png">
      </div>
      <div class="card-body">
        <h3>OMK Wolf Jacket</h3>
        <p class="price">₦80,000</p>
        <button class="btn add-cart">Add to Cart</button>
      </div>
    </div>
  </div>
</section>

<footer>
  <p>© 2025 OMK – Only My Kind | All Rights Reserved</p>
  <div style="margin-top:10px;">
    <span style="font-weight:700;">Follow OMK:</span><br>
    <a href="https://www.instagram.com/whosomotaker" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" width="22">
    </a>
    <a href="https://www.tiktok.com/@omkdrip" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" width="22">
    </a>
  </div>
</footer>
</body>
</html>
