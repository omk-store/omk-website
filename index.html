<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK | Only My Kind</title>

<style>
:root { --fg:#111; --bg:#fff; --border:#eaeaea; --accent:#ff2d55; }
*{box-sizing:border-box;margin:0;padding:0;scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--fg);background:var(--bg)}
a{text-decoration:none;color:inherit;cursor:pointer}

/* HEADER */
header{
  position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 18px
}
.brand{display:flex;align-items:baseline;gap:8px}
.logo{font-weight:900;font-size:22px}
.tag{font-weight:300;opacity:.8;font-size:12px}
.nav{display:flex;align-items:center;gap:14px}
.nav a{font-weight:700;color:#444}
.nav a:hover{color:var(--accent)}
.icon-btn img{width:24px;height:24px;transition:.2s}
.icon-btn img:hover{opacity:.75}

/* HERO (Wolf Section) */
.hero{
  background:url('5CB390F1-C296-439F-A95B-32679E9FE8BA.png') center top/contain no-repeat;
  color:#fff;text-align:center;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
}
.hero h1{
  font-size:clamp(36px,6vw,60px);
  background:linear-gradient(90deg,#ffd87a,#ff2d55,#ff6b6b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-transform:uppercase;
  margin-bottom:16px;
}
.hero p{font-size:18px;opacity:.9;margin-top:10px}
.hero .cta{
  display:inline-block;margin-top:30px;background:var(--accent);
  color:#fff;padding:14px 30px;border-radius:12px;
  font-weight:800;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.hero .cta:hover{opacity:.9}

/* PRODUCTS */
.section{padding:56px 0}
.section h2{text-align:center;font-size:28px;margin-bottom:26px}
.grid{
  width:min(1100px,92%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:22px;
}
.card{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
  transition:transform .25s,box-shadow .25s
}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.card-img{position:relative;overflow:hidden}
.card-img img{width:100%;height:300px;object-fit:cover;border-radius:10px;transition:opacity .35s ease}
.card-img img.back{position:absolute;inset:0;opacity:0}
.card:hover .card-img img.front{opacity:0}
.card:hover .card-img img.back{opacity:1}
.card-body{padding:14px}
.card h3{margin:6px 0 2px;font-size:16px;font-weight:800}
.price{color:#444;font-weight:700;margin-bottom:10px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;font-weight:800}
.btn:hover{opacity:.9}

/* FOOTER */
footer{
  border-top:1px solid var(--border);
  padding:22px 0;
  text-align:center;
  color:#666;
  font-weight:600;
}
footer img{transition:transform .25s}
footer a:hover img{transform:scale(1.12)}

/* CART PANEL */
.panel{
  position:fixed;top:0;right:0;width:80%;max-width:340px;height:100%;background:#fff;
  box-shadow:0 0 22px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .3s ease;
  z-index:60;padding:22px;overflow-y:auto
}
.panel.open{transform:translateX(0)}
.close-btn{position:absolute;top:12px;right:12px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer}
.cart-items{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.cart-item{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;animation:slideIn .3s ease}
.cart-item img{width:50px;height:50px;border-radius:8px;object-fit:cover}
.cart-item-info{flex:1}
.cart-item-info .name{font-weight:800}
.cart-item-info .price{color:#444}
.total{margin-top:16px;text-align:right;font-weight:900}
.checkout-btn{display:block;margin-top:14px;background:var(--accent);color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:800}
.empty{text-align:center;color:#777;margin-top:40px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:50}
.backdrop.show{opacity:1;pointer-events:auto}
@keyframes slideIn {from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>

<body>
<header>
  <div class="brand">
    <a href="#top" class="logo">OMK</a>
    <span class="tag">Only My Kind</span>
  </div>
  <nav class="nav">
    <a href="#shop">Shop</a>
    <a href="register.html" id="registerLink">Register</a>
    <a href="login.html" id="loginLink">Login</a>
    <a href="#" id="userName" style="display:none;font-weight:800"></a>
    <a href="#" id="logoutLink" style="display:none;color:#ff2d55;font-weight:800">Logout</a>
  </nav>
</header>

<section class="hero" id="top">
  <h1>ONLY MY KIND</h1>
  <p>The Wolf • The Crown • The Truth 🐺👑</p>
  <a class="cta" href="#shop">Shop Collection</a>
</section>

<section id="shop" class="section">
  <h2>Latest Drop 🔥</h2>
  <div class="grid">
    <div class="card" data-name="OMK Wolf Jacket" data-price="80000" data-img="https://omkdrip.com/images/omk-jacket-front.png">
      <div class="card-img"><img class="front" src="https://omkdrip.com/images/omk-jacket-front.png"><img class="back" src="https://omkdrip.com/images/omk-jacket-back.png"></div>
      <div class="card-body"><h3>OMK Wolf Jacket</h3><p class="price">₦80,000</p><button class="btn add-cart">Add to Cart</button></div>
    </div>
  </div>
</section>
</body>
</html>
