<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK | Only My Kind</title>

<style>
:root { --border:#eaeaea; --accent:#ff2d55; --dark:#000; }
*{box-sizing:border-box;margin:0;padding:0;scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111;background:#fff}
a{text-decoration:none;color:inherit;cursor:pointer}

/* HEADER */
header{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 20px;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:8px}
.logo{font-weight:900;font-size:22px}
.header-icons{display:flex;align-items:center;gap:14px}
.icon-btn img{width:26px;height:26px;cursor:pointer;transition:.2s}
.icon-btn img:hover{opacity:.75}
.icon-btn.glow img{animation:cartGlow 1.2s infinite alternate}
@keyframes cartGlow{0%{filter:drop-shadow(0 0 0 #ff2d55);}100%{filter:drop-shadow(0 0 6px #ff2d55);}}

/* CART */
.cart-panel{
  position:fixed;top:0;right:0;height:100%;width:320px;background:#fff;
  border-left:1px solid var(--border);box-shadow:-4px 0 12px rgba(0,0,0,.15);
  transform:translateX(100%);transition:transform .35s ease;z-index:90;padding:20px;overflow-y:auto;
}
.cart-panel.open{transform:translateX(0)}
.cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cart-header h3{font-size:18px;font-weight:800}
.close-cart{background:none;border:none;font-size:20px;font-weight:900;cursor:pointer;color:#333}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:8px;font-weight:600}
.cart-item button{background:none;border:none;color:#ff2d55;font-size:18px;cursor:pointer;font-weight:900}
.cart-total{font-weight:800;margin-top:14px;font-size:16px;text-align:right}
.checkout-btn{display:block;margin-top:16px;background:#ff2d55;color:#fff;text-align:center;
  padding:10px 0;border-radius:10px;font-weight:800;text-transform:uppercase;box-shadow:0 4px 10px rgba(255,45,85,.3);}
.checkout-btn:hover{opacity:.9}

/* MENU */
.menu-overlay{position:fixed;top:0;right:0;width:70%;max-width:280px;height:100%;background:#fff;
  box-shadow:-4px 0 14px rgba(0,0,0,.1);transform:translateX(100%);transition:.35s ease;z-index:60;padding:24px;}
.menu-overlay.open{transform:translateX(0)}
.menu-overlay a{display:block;margin:16px 0;font-weight:700;color:#333;font-size:16px;transition:.25s;}
.menu-overlay a:hover{color:var(--accent)}
.close-menu{position:absolute;top:14px;right:14px;font-size:22px;font-weight:900;border:none;background:none;cursor:pointer}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s;z-index:50}
.backdrop.show{opacity:1;pointer-events:auto}

/* HERO */
.hero{text-align:center;padding:36px 16px 0}
.hero img{width:min(420px,92%);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.15)}
.hero p{font-size:15px;color:#444;font-weight:500;margin-top:10px}

/* SECTION */
.section{padding:56px 0}
.section h2{text-align:center;font-size:28px;margin-bottom:26px}
.grid{width:min(1100px,92%);margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}

/* CARD */
.card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,.05);transition:transform .25s,box-shadow .25s;cursor:pointer;position:relative;}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.card-img img{width:100%;height:300px;object-fit:cover;border-radius:10px;}
.card-body{padding:14px}
.card h3{margin:6px 0 2px;font-size:16px;font-weight:800}
.price{color:#444;font-weight:700;margin-bottom:10px}
.btn{display:inline-block;background:#000;color:#fff;padding:10px 20px;border-radius:12px;font-weight:800;transition:.3s}
.btn:hover{background:#111;transform:translateY(-2px)}

/* BADGE */
.badge {
  position:absolute;top:10px;left:10px;background:var(--accent);
  color:#fff;font-size:12px;font-weight:800;padding:6px 10px;border-radius:20px;
}
</style>
</head>

<body>
<header>
  <div class="brand"><a href="#top" class="logo">OMK</a></div>
  <div class="header-icons">
    <a class="icon-btn glow" id="cartBtn"><img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png"></a>
    <a class="icon-btn" id="menuBtn"><img src="https://cdn-icons-png.flaticon.com/512/56/56763.png"></a>
  </div>
</header>

<section class="hero" id="top">
  <img src="./images/jacket-black.jpg">
  <p>Streetwear born from truth, loyalty & the wolf spirit 🐺</p>
</section>

<section id="shop" class="section">
  <h2>Latest Drop 🐺⚡</h2>
  <div class="grid" id="productGrid"></div>
</section>

<script>
function toggleMenu(){
  document.getElementById('menuOverlay').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}
function toggleCart(){
  document.getElementById('cartPanel').classList.toggle('open');
}

/* SAVED ARCHIVE (hidden safely, unchanged) */
const archivedProducts = [
  {name:'OMK Wolf Jacket',price:80000,img:'./images/jacket-black.jpg'},
  {name:'OMK Jeans',price:80000,img:'./images/jeans-blue.jpg'},
  {name:'OMK Shorts',price:50000,img:'./images/shorts-black.jpg'},
  {name:'OMK Lighter Set',price:150000,img:'./images/omk-storm-hoodie.jpg'},
  {name:'OMK Thunder Hoodie Set',price:150000,img:'./images/omk-thunder-hoodie.jpg'},
  {name:'OMK Voltage Signature',price:150000,img:'./images/omk-wolf-spirit-hoodie.jpg'}
];

/* ACTIVE PRODUCT BOXES (TOTAL 5) */
const products = [

  /* 1 — Existing T-shirt */
  {name:'OMK T-Shirt',price:45000,img:'./images/tee-white.jpg',badge:'NEW 🐺⚡'},

  /* 2 — NEW Jacket Box */
  {name:'OMK Wave Jacket — BlackNight Edition',price:80000,img:'./images/new-wave-jacket.jpg',badge:'NEW 🖤🌊'},

  /* 3 — NEW Jean Box */
  {name:'OMK Wave Pants — BlackNight Edition',price:80000,img:'./images/new-wave-pants.jpg',badge:'NEW 🖤🌊'},

  /* 4 — Placeholder Box */
  {name:'COMING SOON A',price:'...',img:'./images/placeholder.jpg',badge:'COMING SOON'},

  /* 5 — Placeholder Box */
  {name:'COMING SOON B',price:'...',img:'./images/placeholder.jpg',badge:'COMING SOON'}
];

/* DISPLAY ALL 5 BOXES */
const grid=document.getElementById('productGrid');
products.forEach((p)=>{
  grid.innerHTML+=`
    <div class="card">
      ${p.badge?`<span class="badge">${p.badge}</span>`:''}
      <div class="card-img"><img src="${p.img}" alt="${p.name}"></div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="price">${p.price==='...'?'...':('₦'+p.price.toLocaleString())}</p>
      </div>
    </div>`;
});
</script>

</body>
</html>
