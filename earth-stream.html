<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>If Earth Could Talk — Stream on Spotify</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:26px;
  padding:18px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.9);
}

.cover{
  width:100%;
  border-radius:18px;
  margin-bottom:14px;
}

h1{
  font-size:20px;
  font-weight:900;
  margin-bottom:4px;
}

.artist{
  font-size:13px;
  color:#555;
}

.message{
  margin:14px 0 16px;
  font-size:14px;
  line-height:1.4;
  color:#222;
}

.btn{
  display:block;
  text-decoration:none;
  background:#000;
  color:#fff;
  padding:16px;
  border-radius:18px;
  font-weight:900;
  font-size:15px;
  letter-spacing:.5px;
}

.note{
  margin-top:10px;
  font-size:12px;
  color:#666;
}

.footer{
  margin-top:12px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">

  <img src="https://raw.githubusercontent.com/omk-store/omk-website/main/27475981-5AEA-4007-BC96-AA39B96FCC87.png"
       class="cover">

  <h1>IF EARTH COULD TALK</h1>
  <div class="artist">Omo Taker • OMK Records</div>

  <div class="message">
    If the Earth could talk… what would it say to us right now?<br>
    Play it once. If you don’t feel it in 30 seconds, skip.
  </div>

  <a class="btn"
     href="https://open.spotify.com/track/7mifEtIK9OPGWD9EyOOLnq"
     target="_blank">
     STREAM ON SPOTIFY
  </a>

  <div class="note">
    Let it play for 30+ seconds so it counts.
  </div>

  <div class="footer">
    © 2026 Omo Taker
  </div>

</div>

</body>
</html>
