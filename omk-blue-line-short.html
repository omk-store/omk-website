<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Blue-Line Shorts 🩳 | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer}

/* LAYOUT */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{display:grid;gap:34px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{width:100%;border-radius:14px;border:1px solid var(--border);object-fit:contain}

.title{font-size:28px;font-weight:900;margin:6px 0 10px}
.desc{color:var(--muted);line-height:1.6;margin-bottom:14px}
.price{font-weight:900;font-size:20px;margin:8px 0 18px}
.subtle{font-size:13px;color:var(--muted)}

.sizes{display:flex;gap:10px;margin:10px 0}
.size{padding:10px 16px;border:1px solid var(--border);border-radius:10px;font-weight:800;cursor:pointer;background:#fff}
.size.active{background:#111;color:#fff;border-color:#111}

.btns{display:flex;gap:12px;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 18px;border-radius:12px;border:1px solid var(--border);
  font-weight:900;cursor:pointer;background:#fff;
}
.btn.primary{background:#111;color:#fff;border-color:#111}

/* FOOTER */
footer{margin:60px 0 90px;text-align:center;color:var(--muted)}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>
  <div class="h-icons">
    <a href="checkout.html"><img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png"></a>
    <img src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<!-- PAGE -->
<main class="wrap">
  <section class="grid">

    <div class="card">
      <div class="gallery">

        <!-- FRONT VIEW -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/0FDEF34E-CFDA-4A0B-92E2-2C68BA19645A.png" alt="OMK Blue-Line Shorts Front">

        <!-- BACK VIEW -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/blue-line-short-back.png" alt="OMK Blue-Line Shorts Back">

      </div>
    </div>

    <div class="card">
      <div class="title">OMK Blue-Line Shorts 🩳</div>

      <div class="desc">
        Clean premium shorts with the signature OMK Blue-Line energy.  
        Soft fabric, athletic cut, and the iconic OMK mark. Perfect for daily drip.
      </div>

      <div class="price">₦70,000</div>

      <div class="subtle">Size</div>
      <div class="sizes">
        <button class="size">S</button>
        <button class="size active">M</button>
        <button class="size">L</button>
        <button class="size">XL</button>
      </div>

      <div class="btns">
        <button class="btn primary" onclick="window.location='checkout.html'">Buy Now</button>
      </div>

      <p class="subtle">Loyalty • Blue-Line • OMK Drip</p>
    </div>

  </section>
</main>

<footer>
  © 2025 OMK — Only My Kind<br>omkdrip@gmail.com
</footer>

</body>
</html>
