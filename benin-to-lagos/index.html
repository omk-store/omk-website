<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benin To Lagos | Omo Taker</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
body{min-height:100vh;background:#000;padding:30px 20px;display:flex;justify-content:center;align-items:center;}
.wrap{width:100%;max-width:420px;background:#fff;border-radius:26px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.9);text-align:center;}

.cover{
  width:100%;
  height:auto;
  max-height:380px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:18px;
}

h1{font-size:24px;font-weight:900;color:#000;}
.artist{font-size:14px;color:#444;margin-bottom:6px;}
.status{font-size:14px;color:#00c853;margin-bottom:22px;}

.platforms{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-bottom:22px;
}

.platform{
  background:#000;
  border-radius:18px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s;
}
.platform:hover{transform:scale(1.03)}

.platform.apple{background:#f2f2f2;}
.platform.apple:hover{background:#e5e5e5;}

.icon{
  font-size:42px;
  color:#fff;
}
.platform.apple .icon{color:#000;}

.instagram{
  grid-column:1/3;
  background:#e1306c;
}
.instagram .icon{color:#fff;}
.instagram:hover{background:#c41f59;}

.btn{
  width:100%;
  padding:16px;
  border-radius:999px;
  font-size:16px;
  font-weight:900;
  border:none;
  margin-bottom:14px;
  cursor:pointer;
}
.shop{background:#000;color:#fff}
.footer{margin-top:14px;font-size:12px;color:#777;}
</style>
</head>

<body>
<div class="wrap">

  <!-- COVER -->
  <img src="https://raw.githubusercontent.com/omk-store/omk-website/main/914C5ED9-2BF8-4515-9320-9169F7E32FBB.png" class="cover">

  <h1>BENIN TO LAGOS</h1>
  <div class="artist">Omo Taker • OMK Records</div>
  <div class="status">Out Now 🌍🐺</div>

  <div class="platforms">
    <!-- Spotify -->
    <div class="platform" onclick="openLink('https://open.spotify.com/track/0SooNM8i9p1UiE7HTTp5C4')">
      <div class="icon">🎧</div>
    </div>

    <!-- Apple Music -->
    <div class="platform apple" onclick="openLink('https://music.apple.com/ng/album/benin-to-lagos/1866424075?i=1866424076')">
      <div class="icon">🍎</div>
    </div>

    <!-- Boomplay -->
    <div class="platform" onclick="openLink('https://www.boomplay.com/songs/231357454')">
      <div class="icon">🔊</div>
    </div>

    <!-- Audiomack -->
    <div class="platform" onclick="openLink('https://audiomack.com/iam_omotaker/song/benin-to-lagos')">
      <div class="icon">🎶</div>
    </div>

    <!-- Instagram -->
    <div class="platform instagram" onclick="openLink('https://www.instagram.com/iam_omotaker')">
      <div class="icon">📸</div>
    </div>
  </div>

  <button class="btn shop" onclick="openLink('https://omkdrip.com')">🐺 SHOP OMK</button>

  <div class="footer">© 2026 Omo Taker • OMK Records</div>
</div>

<script>
function openLink(url){
  window.open(url,'_blank');
}
</script>

</body>
</html>
