<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Register | OMK</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',system-ui,sans-serif}
body{
  height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 20%,#1a1a1a,#000);
  color:#fff;overflow:hidden;
}
.container{
  width:90%;max-width:400px;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;padding:30px 24px;text-align:center;
  backdrop-filter:blur(10px);box-shadow:0 0 40px rgba(255,45,85,0.25);
  animation:fadeIn .8s ease;
}
h1{
  font-size:28px;margin-bottom:8px;
  background:linear-gradient(90deg,#ffd87a,#ff2d55,#ff6b6b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-transform:uppercase;font-weight:900;
}
p{color:#bbb;font-size:14px;margin-bottom:22px}
input{
  width:100%;margin-bottom:14px;padding:12px 14px;
  border-radius:10px;border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.05);color:#fff;font-size:14px;
}
input::placeholder{color:#aaa}
button{
  width:100%;padding:12px;margin-top:4px;
  background:#ff2d55;border:none;border-radius:10px;
  color:#fff;font-weight:800;cursor:pointer;transition:.25s;
}
button:hover{background:#ff456b;transform:translateY(-1px)}
a{color:#ff2d55;text-decoration:none;font-weight:600;font-size:14px}
a:hover{opacity:.8}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<body>
<div class="container">
  <h1>OMK</h1>
  <p>Join the Only My Kind pack 🐺</p>

  <form action="mailto:omorogbeale69@gmail.com" method="post" enctype="text/plain">
    <input type="text" name="Name" placeholder="Full Name" required>
    <input type="email" name="Email" placeholder="Email Address" required>
    <input type="password" name="Password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <p style="margin-top:20px;">Already have an account? <a href="login.html">Login</a></p>
  <p style="margin-top:10px;"><a href="index.html">← Back to Home</a></p>
</div>
</body>
</html>
