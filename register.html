<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Register | OMK</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:radial-gradient(60% 60% at 50% 30%,#111 0%,#0b0b0b 100%);
    color:#fff;overflow:hidden
  }
  .card{
    width:min(92vw,430px);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:28px 22px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 28px rgba(255,45,85,.12);
  }
  h1{font-size:30px;margin-bottom:8px}
  p{color:#bbb;margin-bottom:16px}
  input{
    width:100%;padding:12px 14px;margin-bottom:14px;
    border-radius:10px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);color:#fff;font-size:15px;outline:none
  }
  input::placeholder{color:#9aa}
  .check{
    display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:14px;color:#aaa
  }
  button{
    width:100%;padding:12px;border:0;border-radius:10px;
    background:#ff2d55;color:#fff;font-weight:900;cursor:pointer;transition:.2s
  }
  button:hover{transform:translateY(-1px)}
  .links{text-align:center;margin-top:14px}
  .links a{color:#ff2d55;text-decoration:none;font-weight:800}
  footer{
    position:fixed;bottom:14px;left:0;right:0;
    text-align:center;color:#9aa;font-size:13px
  }
  footer a{color:#ff2d55;text-decoration:none;font-weight:800}
</style>
</head>
<body>
  <div class="card">
    <h1>Join the Pack</h1>
    <p>Create your OMK account to access drops 🐺</p>

    <form id="registerForm">
      <input id="name"  type="text" placeholder="Full Name" required>
      <input id="email" type="email" placeholder="Email Address" required>
      <input id="pass"  type="password" placeholder="Password" required>

      <label class="check">
        <input type="checkbox" id="updates" style="width:16px;height:16px">
        Send me updates about new drops 💥
      </label>

      <button type="submit">Register</button>
    </form>

    <div class="links">
      Already have an account? <a href="login.html">Login</a><br>
      <a href="index.html" style="display:inline-block;margin-top:10px">← Back to Home</a>
    </div>
  </div>

  <footer>
    Problems? <a href="mailto:omkdrip@gmail.com?subject=OMK%20Register%20Issue&body=Hi%20OMK%2C%20I%20need%20help%20registering.">Report a problem 💌</a>
  </footer>

<script>
document.getElementById('registerForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const name  = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  const updates = document.getElementById('updates').checked;

  // Save details locally (mock backend)
  localStorage.setItem('omk_user', JSON.stringify({ name, email, pass, updates }));

  // Create success popup
  const success = document.createElement('div');
  success.style.position='fixed';
  success.style.inset='0';
  success.style.display='flex';
  success.style.alignItems='center';
  success.style.justifyContent='center';
  success.style.background='rgba(0,0,0,.6)';
  success.style.zIndex='99';
  success.innerHTML=`
    <div style="background:#111;border:1px solid #333;padding:28px 22px;border-radius:14px;text-align:center;box-shadow:0 0 25px rgba(255,45,85,.3)">
      <h2 style="color:#ff2d55;margin-bottom:8px">Account Created 🐺</h2>
      <p style="color:#ccc">Welcome to the Only My Kind Pack!</p>
      <p style="color:#aaa;margin-top:6px">Check your email for a welcome message 💌</p>
      ${updates ? '<p style="color:#ff2d55;margin-top:10px;">You’ll also get updates about new drops 🔥</p>' : ''}
    </div>`;
  document.body.appendChild(success);

  // Redirect to login after 2 seconds
  setTimeout(()=>{ window.location.href = 'login.html'; },2000);
});
</script>
</body>
</html>
