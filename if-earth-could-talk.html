<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>If Earth Could Talk | Omo Taker</title>

<style>
:root{
  --bg:#000;
  --card:#ffffff;
  --text:#0a0a0a;
  --muted:#5c5c5c;
  --line:#ececec;
  --shadow:0 30px 80px rgba(0,0,0,.9);

  --radius:26px;
  --radius2:18px;

  --spotify:#0b0b0b;
  --apple:#f2f2f2;
  --dark:#0b0b0b;
  --ig:#e1306c;
  --tiktok:#0b0b0b;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}

body{
  min-height:100vh;
  background:var(--bg);
  padding:30px 18px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wrap{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  text-align:center;
  border:1px solid rgba(255,255,255,.06);
}

/* BRAND */
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:14px;
}
.logo{
  width:44px;height:44px;border-radius:12px;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;
  overflow:hidden;
}
.logo img{width:100%;height:100%;object-fit:cover;}
.brandtext{text-align:left;line-height:1.05;}
.brandtext b{display:block;font-size:14px;}
.brandtext span{display:block;font-size:12px;color:var(--muted);}

/* COVER */
.cover{
  width:100%;
  max-height:360px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:14px;
}

/* TITLE */
h1{font-size:22px;font-weight:1000;letter-spacing:.5px;color:var(--text);}
.artist{font-size:13px;color:#444;margin-top:6px;}
.status{
  font-size:13px;
  color:#0aa84f;
  margin:10px 0 18px;
  font-weight:700;
}

/* SECTION */
.section{
  text-align:left;
  margin:10px 4px 10px;
  color:#111;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  opacity:.75;
}

/* BUTTONS */
.platforms{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-bottom:14px;
}

.btn{
  text-decoration:none;
  border-radius:16px;
  padding:14px;
  font-weight:900;
  font-size:14px;
  letter-spacing:.6px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  transition:.15s;
  min-height:54px;
}

.btn:active{transform:scale(.98);}

.icon{
  width:34px;height:34px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.12);
  flex:0 0 34px;
}
.icon img{width:18px;height:18px;}

/* COLORS */
.spotify{background:var(--spotify);color:#fff;border-color:var(--spotify);}
.apple{background:var(--apple);color:#000;border-color:#e7e7e7;}
.dark{background:var(--dark);color:#fff;border-color:var(--dark);}
.instagram{background:var(--ig);color:#fff;border-color:var(--ig);}
.tiktok{background:var(--tiktok);color:#fff;border-color:var(--tiktok);}

/* SHOP */
.shop{
  width:100%;
  padding:15px;
  border-radius:999px;
  font-size:15px;
  font-weight:1000;
  border:none;
  background:#000;
  color:#fff;
  cursor:pointer;
  margin-top:10px;
}
.shop:active{transform:scale(.99);}

.footer{margin-top:14px;font-size:12px;color:#777;}
.smallnote{font-size:12px;color:#777;margin-top:6px;}
</style>
</head>

<body>

</html>
