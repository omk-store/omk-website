<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login | OMK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
  height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#111 0%,#000 100%);
  color:#fff;overflow:hidden
}
.container{
  width:90%;max-width:400px;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;padding:30px 24px;text-align:center;
  backdrop-filter:blur(10px);box-shadow:0 0 25px rgba(255,45,85,0.2);
  animation:fadeIn .8s ease
}
h1{
  font-size:28px;margin-bottom:8px;
  background:linear-gradient(90deg,#ff2d55,#ff6b6b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-transform:uppercase;font-weight:900
}
p{color:#bbb;font-size:14px;margin-bottom:22px}
input{
  width:100%;margin-bottom:14px;padding:12px 14px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05);color:#fff;font-size:14px
}
input::placeholder{color:#aaa}
button{
  width:100%;padding:12px;margin-top:4px;background:#ff2d55;border:none;
  border-radius:10px;color:#fff;font-weight:800;cursor:pointer;transition:.25s
}
button:hover{background:#ff456b;transform:translateY(-2px)}
a{color:#ff2d55;text-decoration:none;font-weight:600}
a:hover{opacity:.8}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<body>
<div class="container">
  <h1>OMK</h1>
  <p>Welcome back to the Only My Kind pack 🐺</p>

  <form action="mailto:omorogbeale69@gmail.com" method="post" enctype="text/plain">
    <input type="email" name="Email" placeholder="Email Address" required>
    <input type="password" name="Password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <div style="margin-top:20px">
    <a href="register.html">Don’t have an account? Register</a><br><br>
    <a href="index.html">← Back to Home</a>
  </div>
</div>
</body>
</html>
