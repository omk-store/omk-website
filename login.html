<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login | OMK</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:radial-gradient(60% 60% at 50% 30%,#111 0%,#0b0b0b 100%);
    color:#fff;overflow:hidden
  }
  .card{
    width:min(92vw,430px);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:28px 22px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 28px rgba(255,45,85,.12);
  }
  h1{font-size:30px;margin-bottom:8px}
  p{color:#bbb;margin-bottom:16px}
  input{
    width:100%;padding:12px 14px;margin-bottom:14px;
    border-radius:10px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);color:#fff;font-size:15px;outline:none
  }
  input::placeholder{color:#9aa}
  button{
    width:100%;padding:12px;border:0;border-radius:10px;
    background:#ff2d55;color:#fff;font-weight:900;cursor:pointer;transition:.2s
  }
  button:hover{transform:translateY(-1px)}
  .links{text-align:center;margin-top:14px}
  .links a{color:#ff2d55;text-decoration:none;font-weight:800}
  footer{
    position:fixed;bottom:14px;left:0;right:0;
    text-align:center;color:#9aa;font-size:13px
  }
  footer a{color:#ff2d55;text-decoration:none;font-weight:800}
</style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p>Log in to shop the latest drops.</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Email Address" required>
      <input id="pass"  type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="links">
      No account? <a href="register.html">Create one</a><br>
      <a href="index.html" style="display:inline-block;margin-top:10px">← Back to Home</a>
    </div>
  </div>

  <footer>
    Problems? <a href="mailto:omkdrip@gmail.com?subject=OMK%20Support%20Login%20Issue&body=Hi%20OMK%2C%20I%20can%27t%20log%20in.%20Please%20help.">Report a problem 💌</a>
  </footer>

<script>
document.getElementById('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const saved = JSON.parse(localStorage.getItem('omk_user')||'{}');
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;

  if(saved.email === email && saved.pass === pass){
    localStorage.setItem('omk_logged_in','1');
    
    // Create success popup
    const success = document.createElement('div');
    success.style.position='fixed';
    success.style.inset='0';
    success.style.display='flex';
    success.style.alignItems='center';
    success.style.justifyContent='center';
    success.style.background='rgba(0,0,0,.6)';
    success.style.zIndex='99';
    success.innerHTML=`
      <div style="background:#111;border:1px solid #333;padding:28px 22px;border-radius:14px;text-align:center;box-shadow:0 0 25px rgba(255,45,85,.3)">
        <h2 style="color:#ff2d55;margin-bottom:8px">Login Successful 🐺</h2>
        <p style="color:#ccc">Welcome back to the Pack!</p>
      </div>`;
    document.body.appendChild(success);
    
    // Redirect to shop after 2 seconds
    setTimeout(()=>{ window.location.href = 'index.html#shop'; },2000);

  }else{
    alert('Incorrect email or password. Try again.');
  }
});
</script>
</body>
</html>
