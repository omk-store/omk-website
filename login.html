<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login | OMK</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:radial-gradient(60% 60% at 50% 30%,#111 0%,#0b0b0b 100%);
    color:#fff;overflow:hidden
  }
  .card{
    width:min(92vw,420px);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:30px 22px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 28px rgba(255,45,85,.12);
  }
  h1{font-size:30px;margin-bottom:8px}
  p{color:#bbb;margin-bottom:16px}
  input{
    width:100%;padding:12px 14px;margin-bottom:14px;
    border-radius:10px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);color:#fff;font-size:15px;outline:none
  }
  input::placeholder{color:#9aa}
  button{
    width:100%;padding:12px;border:0;border-radius:10px;
    background:#ff2d55;color:#fff;font-weight:900;cursor:pointer;transition:.2s
  }
  button:hover{transform:translateY(-1px)}
  .links{text-align:center;margin-top:14px}
  .links a{color:#ff2d55;text-decoration:none;font-weight:800}
  footer{
    position:fixed;bottom:14px;left:0;right:0;
    text-align:center;color:#9aa;font-size:13px
  }
  footer a{color:#ff2d55;text-decoration:none;font-weight:800}
</style>
</head>
<body>
  <div class="card">
    <h1>Welcome Back 🐺</h1>
    <p>Login to continue your OMK journey</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Email Address" required>
      <input id="pass"  type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="links">
      Don’t have an account? <a href="register.html">Register</a><br>
      <a href="index.html" style="display:inline-block;margin-top:10px">← Back to Home</a>
    </div>
  </div>

  <footer>
    Problems? <a href="mailto:omkdrip@gmail.com?subject=OMK%20Login%20Issue&body=Hi%20OMK%2C%20I%20need%20help%20logging%20in.">Report a problem 💌</a>
  </footer>

<script>
document.getElementById('loginForm').addEventListener('submit',(e)=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const saved=JSON.parse(localStorage.getItem('omk_user'));

  if(!saved){alert('No account found. Please register first.');return;}
  if(email===saved.email && pass===saved.pass){
    const popup=document.createElement('div');
    popup.style.position='fixed';
    popup.style.inset='0';
    popup.style.display='flex';
    popup.style.alignItems='center';
    popup.style.justifyContent='center';
    popup.style.background='rgba(0,0,0,.6)';
    popup.innerHTML=`
      <div style="background:#111;border:1px solid #333;padding:28px 22px;border-radius:14px;text-align:center;box-shadow:0 0 25px rgba(255,45,85,.3)">
        <h2 style="color:#ff2d55;margin-bottom:8px;">Login Successful 🐺</h2>
        <p style="color:#ccc;">Welcome back to Only My Kind!</p>
      </div>`;
    document.body.appendChild(popup);
    setTimeout(()=>{ window.location.href='index.html'; },2000);
  } else {
    alert('Invalid email or password. Try again.');
  }
});
</script>
</body>
</html>
