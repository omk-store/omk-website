<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Chrome Tee 👕 | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer}

/* CART ICON */
.cart-btn{position:relative;cursor:pointer}
.cart-count{
  position:absolute;top:-4px;right:-6px;background:var(--omk);color:#fff;
  font-size:11px;font-weight:700;border-radius:50%;width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;
}

/* PAGE */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{
  display:grid;gap:34px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  align-items:start;
}

/* PRODUCT CARD */
.card{
  background:#fff;border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--shadow);padding:14px
}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{
  width:100%;border-radius:14px;border:1px solid var(--border);object-fit:contain;
}

/* TEXT */
.title{font-size:28px;font-weight:900;margin:6px 0 10px}
.desc{color:var(--muted);line-height:1.7;margin-bottom:14px}
.price{font-weight:900;font-size:20px;margin:6px 0 18px}
.subtle{font-size:13px;color:var(--muted)}

/* SIZE */
.sizes{display:flex;gap:10px;margin:10px 0 4px}
.size{
  padding:10px 16px;border:1px solid var(--border);border-radius:10px;
  font-weight:800;cursor:pointer;background:#fff
}
.size.active{background:#111;color:#fff;border-color:#111}

/* BUTTONS */
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:12px;border:1px solid var(--border);
  font-weight:900;cursor:pointer;background:#fff;
}
.btn.primary{background:#111;color:#fff;border-color:#111}

/* CART DRAWER */
.cart-drawer-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.3);display:none;z-index:9000;
}
.cart-drawer{
  position:fixed;right:0;top:0;width:300px;height:100%;
  background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.15);
  transform:translateX(100%);transition:.35s;z-index:9999;
  padding:20px;display:flex;flex-direction:column;
}
.cart-drawer.open{transform:translateX(0)}
.cart-title{font-weight:900;font-size:18px;margin-bottom:16px}
.cart-items{flex:1;overflow-y:auto;padding-right:6px}
.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid #eee;
}
.remove-btn{cursor:pointer;font-size:20px;font-weight:900;color:#333}
.checkout-btn{
  padding:12px 16px;background:#111;color:#fff;border-radius:10px;
  text-align:center;font-weight:900;margin-top:14px;display:block;
}

/* CHAT */
.chat-btn{
  position:fixed;right:18px;bottom:20px;z-index:2000;
  background:#fff;border:1px solid var(--border);
  padding:10px 16px;border-radius:40px;display:flex;
  align-items:center;gap:8px;font-weight:800;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}
.chat-btn img{width:20px;height:20px}

/* FOOTER */
footer{
  margin:60px 0 90px;text-align:center;color:var(--muted);font-weight:600
}
</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>

  <div class="h-icons">
    <div class="cart-btn" id="cartBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png">
      <div id="cartCount" class="cart-count" style="display:none">0</div>
    </div>
    <img id="menuBtn" src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<main class="wrap">
  <section class="grid">

    <!-- IMAGE GALLERY -->
    <div class="card">
      <div class="gallery">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/9B95C37E-46F1-457A-9548-CF4E5B2A9227.png">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/742321CF-26
