<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Chrome Tee 👕 | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --shadow:0 10px 30px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
a{text-decoration:none;color:inherit}

/* HEADER */
header{
  position:sticky;top:0;z-index:50;background:#fff;
  border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
}
.logo{font-weight:900;font-size:22px}

/* PRODUCT */
.wrapper{
  width:min(900px,92%);margin:25px auto;
}
.product-img{
  width:100%;border-radius:14px;box-shadow:var(--shadow);
  margin-bottom:14px;
}
h1{font-size:28px;margin:12px 0;font-weight:900}
.price{
  font-size:22px;font-weight:800;margin-bottom:18px;
}
.buy{
  display:block;width:100%;background:#000;color:#fff;
  text-align:center;padding:16px;border-radius:12px;
  font-weight:800;font-size:18px;margin-top:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.section-title{
  margin-top:30px;font-size:20px;font-weight:800;margin-bottom:10px;
}
.details{
  font-size:15px;line-height:1.6;color:#444;
}

.size-btns{display:flex;gap:10px;margin:12px 0}
.size-btn{
  padding:10px 16px;background:#fff;border:1px solid var(--border);
  border-radius:10px;font-weight:800;cursor:pointer;
}
.size-btn.active{background:#000;color:#fff;border-color:#000}
</style>
</head>

<body>

<header>
  <div class="logo">OMK</div>
</header>

<div class="wrapper">

  <!-- ONLY REAL PRODUCT IMAGES -->
  <img class="product-img" 
    src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/9B95C37E-46F1-457A-9548-CF4E5B2A9227.png">

  <img class="product-img"
    src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/tee-white.jpg">

  <!-- TITLE -->
  <h1>OMK Chrome Tee 👕</h1>

  <!-- PRICE -->
  <div class="price">₦60,000</div>

  <!-- SIZES -->
  <div class="section-title">Select Size</div>
  <div class="size-btns">
    <div class="size-btn">S</div>
    <div class="size-btn active">M</div>
    <div class="size-btn">L</div>
    <div class="size-btn">XL</div>
  </div>

  <!-- BUY BUTTON -->
  <a class="buy" href="https://wa.me/2348118618722?text=I%20want%20the%20OMK%20Chrome%20Tee">
    Buy Now →
  </a>

  <!-- DETAILS -->
  <div class="section-title">Details</div>
  <div class="details">
    • Premium cotton  
    <br>• Chrome OMK chest logo  
    <br>• Smooth print finish  
    <br>• True to size  
  </div>

  <div class="section-title">Sizes</div>
  <div class="details">M, L, XL</div>

</div>

</body>
</html>
