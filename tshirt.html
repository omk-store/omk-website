<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Chrome Tee 👕 | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
}
.brand{font-weight:900;font-size:20px}

/* PAGE */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{
  display:grid;
  gap:30px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
}

/* CARD */
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
}

/* IMAGES */
.gallery{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.gallery img{
  width:100%;
  height:420px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid var(--border);
}

/* TEXT */
.title{
  font-size:28px;
  font-weight:900;
  margin:6px 0 10px;
}
.desc{
  color:var(--muted);
  line-height:1.6;
  margin-bottom:14px;
}
.price{
  font-weight:900;
  font-size:22px;
  margin-bottom:14px;
}

/* SIZE */
.sizes{display:flex;gap:10px}
.size{
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}
.size.active{
  background:#111;
  color:#fff;
}

/* BUTTONS */
.btns{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;
  padding:14px;
  border-radius:12px;
  font-weight:900;
  text-align:center;
  border:1px solid var(--border);
}
.btn.primary{
  background:#111;
  color:#fff;
}

/* CHAT */
.chat-btn{
  position:fixed;
  right:18px;
  bottom:20px;
  background:#fff;
  border:1px solid var(--border);
  padding:10px 16px;
  border-radius:40px;
  display:flex;
  gap:8px;
  font-weight:800;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}
.chat-btn img{width:20px}
</style>
</head>

<body>

<header class="header">
  <div class="brand">OMK</div>
</header>

<main class="wrap">
  <section class="grid">

    <!-- IMAGES -->
    <div class="card">
      <div class="gallery">

        <!-- FRONT -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/9B95C37E-46F1-457A-9548-CF4E5B2A9227.png">

        <!-- BACK -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/e2ac4e3fb062700d2c65c70072428af331f79c34/A06AFAB2-F860-4CC4-935F-7549589FC48D.png">

      </div>
    </div>

    <!-- DETAILS -->
    <div class="card">

      <div class="title">OMK Chrome Tee 👕</div>

      <div class="desc">
        Premium chrome-styled OMK tee. Clean, bold and made for everyday drip.
      </div>

      <div class="price">₦80,000</div>

      <div class="sizes">
        <button class="size">S</button>
        <button class="size active">M</button>
        <button class="size">L</button>
        <button class="size">XL</button>
      </div>

      <div class="btns">
        <div class="btn">Add to Cart</div>
        <div class="btn primary">Buy Now</div>
      </div>

    </div>

  </section>
</main>

<!-- WHATSAPP -->
<a class="chat-btn" target="_blank"
href="https://wa.me/2347038112817?text=Hi%20OMK%2C%20I%20want%20to%20order%20the%20Chrome%20Tee">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
  Chat
</a>

</body>
</html>
