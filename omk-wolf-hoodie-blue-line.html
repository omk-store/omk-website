<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Wolf Hoodie (Blue-Line) 🐺 | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer}

/* PAGE */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{display:grid;gap:34px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{width:100%;border-radius:14px;border:1px solid var(--border);object-fit:contain}

/* TEXT */
.title{font-size:28px;font-weight:900;margin:6px 0 10px}
.desc{color:var(--muted);line-height:1.6;margin-bottom:14px}
.price{font-weight:900;font-size:22px;margin:10px 0 16px}
.subtle{font-size:13px;color:var(--muted);margin-bottom:6px}

/* BUTTONS */
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn{padding:14px 18px;border-radius:12px;border:1px solid var(--border);font-weight:900;cursor:pointer;background:#fff}
.btn.primary{background:#000;color:#fff;border-color:#000}

footer{text-align:center;padding:40px 0 80px;color:var(--muted);font-weight:600}
</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>
  <div class="h-icons">
    <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png">
    <img src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<main class="wrap">
  <section class="grid">

    <!-- IMAGES -->
    <div class="card">
      <div class="gallery">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/56A58A00-78C3-4799-8220-18254057C8BD.png">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/1637CA26-DCA2-4D8C-A95A-F67CD0C3E9D4.png">
      </div>
    </div>

    <!-- DETAILS -->
    <div class="card">

      <div class="title">OMK Wolf Hoodie (Blue-Line)</div>

      <div class="desc">
        Premium Navy Blue OMK Wolf Hoodie with deep-blue wolf-back print and
        chest OMK mark. Heavyweight, clean stitching and Wolf-Tribe streetwear identity.
      </div>

      <div class="price">₦85,000</div>

      <div class="btns">
        <a class="btn primary" href="https://wa.me/2348118618722?text=I%20want%20the%20OMK%20Wolf%20Hoodie%20(Blue-Line)">
          Buy Now →
        </a>
      </div>

      <p class="subtle" style="margin-top:14px">OMK • ONLY MY KIND • Blue-Line Edition</p>

    </div>
  </section>
</main>

<footer>
  © 2025 <strong>OMK – Only My Kind</strong> · All Rights Reserved
</footer>

</body>
</html>
