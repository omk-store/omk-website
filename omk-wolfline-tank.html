<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Wolfline Tank Top | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --omk:#ff2d55;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer}

/* CART COUNTER */
.cart-btn{position:relative}
.cart-count{
  position:absolute;top:-4px;right:-6px;background:var(--omk);color:#fff;
  font-size:11px;font-weight:700;border-radius:50%;width:16px;height:16px;
  display:none;align-items:center;justify-content:center
}

/* MENU */
.menu-drawer{
  position:fixed;top:0;right:-100%;width:100%;max-width:300px;height:100%;
  background:#fff;z-index:200;transition:.4s ease;
  box-shadow:-5px 0 20px rgba(0,0,0,.1);padding:30px 24px;
}
.menu-drawer.open{right:0}
.menu-close{
  position:absolute;top:16px;right:18px;font-size:24px;font-weight:900;cursor:pointer
}

/* PAGE */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{
  display:grid;gap:34px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  align-items:start;
}
.card{
  background:#fff;border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--shadow);padding:14px
}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{
  width:100%;border-radius:14px;border:1px solid var(--border);object-fit:contain
}

.title{font-size:28px;font-weight:900;margin-bottom:10px}
.desc{color:var(--muted);line-height:1.7;margin-bottom:14px}
.price{font-weight:900;font-size:22px;margin-bottom:18px}

/* SIZES */
.sizes{display:flex;gap:10px;margin:10px 0 4px}
.size{
  padding:10px 16px;border:1px solid var(--border);border-radius:10px;
  font-weight:800;background:#fff;cursor:pointer
}
.size.active{background:#111;color:#fff;border-color:#111}

/* BUTTONS */
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 18px;border-radius:12px;border:1px solid var(--border);
  font-weight:900;background:#fff;cursor:pointer;
}
.btn.primary{background:#111;color:#fff;border-color:#111}

/* CART PANEL */
.cart-panel{
  position:fixed;left:0;right:0;bottom:-100%;background:#fff;
  border-top:2px solid var(--border);box-shadow:0 -8px 20px rgba(0,0,0,.1);
  transition:bottom .4s ease;z-index:150;padding:20px;border-radius:20px 20px 0 0
}
.cart-panel.open{bottom:0}
.cart-item{
  display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid #eee;font-size:14px;font-weight:600
}

footer{
  margin:60px 0 90px;text-align:center;color:var(--muted);font-weight:600
}

/* WHATSAPP FLOAT */
.wa{
  position:fixed;right:16px;bottom:90px;z-index:300;background:#fff;
  border:1px solid var(--border);border-radius:999px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;font-weight:900;box-shadow:var(--shadow);
}
.wa img{width:18px;height:18px}
.dot{width:8px;height:8px;background:var(--omk);border-radius:50%}
</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>

  <div class="h-icons">
    <div class="cart-btn" id="cartBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png">
      <div id="cartCount" class="cart-count">0</div>
    </div>
    <img id="menuBtn" src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<!-- MENU -->
<div id="menuDrawer" class="menu-drawer">
  <span class="menu-close" id="menuClose">✕</span>
  <h3>Menu</h3>
  <a href="index.html">Shop</a>
  <a href="products.html">All Products</a>
  <a href="collections.html">Collections</a>
  <a href="about.html">About</a>
</div>

<!-- PAGE -->
<main class="wrap">
<section class="grid">

  <!-- IMAGES -->
  <div class="card">
    <div class="gallery">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/C0DCC802-519A-482E-A86D-93CA99AB8638.png">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/F2748C95-048D-4A42-AD8A-34C5320389C4.png">
    </div>
  </div>

  <!-- DETAILS -->
  <div class="card">
    <div class="title">OMK Wolfline Tank Top</div>
    <div class="desc">Sleek athletic tank top infused with OMK Wolfline energy.</div>
    <div class="price">₦55,000</div>

    <div class="subtle">Size</div>
    <div class="sizes">
      <button class="size">S</button>
      <button class="size active">M</button>
      <button class="size">L</button>
      <button class="size">XL</button>
    </div>

    <div class="btns">
      <button class="btn" id="addToCart">Add to Cart</button>
      <a class="btn primary" href="checkout.html">Buy Now</a>
    </div>

    <p class="subtle" style="margin-top:14px">Wolfline • OMK Drip</p>
  </div>

</section>
</main>

<!-- CART PANEL -->
<div id="cartPanel" class="cart-panel">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <div style="margin-top:12px;font-weight:800" id="cartTotal">Total: ₦0</div>
  <a href="checkout.html" style="display:block;margin-top:14px;font-weight:900;background:#000;color:#fff;padding:14px;border-radius:12px;text-align:center">Checkout</a>
</div>

<footer>
  © 2025 <strong>OMK – Only My Kind</strong>
</footer>

<!-- WHATSAPP FLOAT -->
<a class="wa" target="_blank" href="https://wa.me/2347038112817?text=Hi%20OMK%2C%20I%20want%20to%20order%20the%20OMK%20Wolfline%20Tank%20Top">
  <span class="dot"></span>
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
  <span>Chat with us</span>
</a>

<script>
/* SIZE SELECTOR */
document.querySelectorAll('.size').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
  };
});

/* CART SYSTEM */
let cart=JSON.parse(localStorage.getItem('omkCart')||'[]');
updateCart();

function addToCart(){
  const size=document.querySelector('.size.active')?.textContent||'M';
  cart.push({name:`OMK Wolfline Tank Top (${size})`,price:55000});
  localStorage.setItem('omkCart',JSON.stringify(cart));
  updateCart();
  toggleCart();
}
document.getElementById('addToCart').onclick=addToCart;

function updateCart(){
  const items=document.getElementById('cartItems');
  const totalBox=document.getElementById('cartTotal');
  const count=document.getElementById('cartCount');
  let total=0;
  items.innerHTML='';
  cart.forEach(it=>{
    total+=it.price;
    items.innerHTML+=`<div class="cart-item"><span>${it.name}</span><span>₦${it.price.toLocaleString()}</span></div>`;
  });
  totalBox.textContent='Total: ₦'+total.toLocaleString();
  count.textContent=cart.length;
  count.style.display=cart.length?'flex':'none';
}

function toggleCart(){
  document.getElementById('cartPanel').classList.toggle('open');
}
document.getElementById('cartBtn').onclick=toggleCart;

/* MENU */
document.getElementById('menuBtn').onclick=()=>menuDrawer.classList.add('open');
document.getElementById('menuClose').onclick=()=>menuDrawer.classList.remove('open');
</script>

</body>
</html>
