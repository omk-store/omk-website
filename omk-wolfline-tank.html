<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Wolfline Tank Top | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;
  --text:#101010;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#111111;
  --shadow:0 10px 30px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(8px);
}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer;transition:.3s}

/* PAGE */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{display:grid;gap:34px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  align-items:start;
}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:14px}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{width:100%;border-radius:14px;border:1px solid var(--border);
  object-fit:contain;}

/* TEXT */
.title{font-size:28px;font-weight:900;margin:6px 0 10px}
.desc{color:var(--muted);line-height:1.6;margin-bottom:14px}
.price{font-weight:900;font-size:22px;margin:10px 0 16px}
.subtle{font-size:13px;color:var(--muted);margin-bottom:6px}

/* SIZE BUTTONS */
.sizes{display:flex;gap:10px;margin:10px 0 4px}
.size{padding:10px 16px;border:1px solid var(--border);
  border-radius:10px;font-weight:800;cursor:pointer;background:#fff}
.size.active{background:#111;color:#fff;border-color:#111}

/* BUTTONS */
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:12px;border:1px solid var(--border);
  font-weight:900;cursor:pointer;background:#fff;
}
.btn.primary{background:#000;color:#fff;border-color:#000}
.btn:active{transform:translateY(1px)}

footer{text-align:center;padding:40px 0 80px;color:var(--muted);font-weight:600}

/* WHATSAPP BUTTON */
.wa{
  position:fixed;right:16px;bottom:90px;z-index:300;background:#fff;
  border:1px solid var(--border);border-radius:999px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);
  font-weight:900;
}
.wa img{width:18px;height:18px}
.dot{width:8px;height:8px;background:#ff2d55;border-radius:50%}
</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>
  <div class="h-icons">
    <div id="cartBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png">
      <div id="cartCount" style="
        display:none;background:#ff2d55;color:#fff;font-size:12px;
        padding:2px 6px;border-radius:8px;position:absolute;transform:translate(12px,-8px);
      ">0</div>
    </div>
    <img src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<main class="wrap">
  <section class="grid">
    
    <!-- IMAGES -->
    <div class="card">
      <div class="gallery">

        <!-- FRONT -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/7ec11b6c53c12bc248e3ec9308e26c25605d1d88/7A644193-F63C-44F1-8862-9C47E5F5A56E.png">

        <!-- BACK -->
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/F2748C95-048D-4A42-AD8A-34C5320389C4.png">

      </div>
    </div>

    <!-- DETAILS -->
    <div class="card">

      <div class="title">OMK Wolfline Tank Top</div>

      <div class="desc">
        Sleek athletic tank top infused with OMK Wolfline energy.
      </div>

      <div class="price">₦55,000</div>

      <div class="subtle">Select Size</div>
      <div class="sizes" id="sizes">
        <button class="size">S</button>
        <button class="size active">M</button>
        <button class="size">L</button>
        <button class="size">XL</button>
      </div>

      <div class="btns">
        <button class="btn" id="addToCart">Add to Cart</button>
        <a class="btn primary" href="checkout.html">Buy Now</a>
      </div>

      <p class="subtle" style="margin-top:14px">
        Wolfline • OMK Drip
      </p>

    </div>
  </section>
</main>

<footer>
  © 2025 <strong>OMK – Only My Kind</strong>  
  <br>Contact: omkdrip@gmail.com
</footer>

<!-- WhatsApp -->
<a class="wa" target="_blank"
href="https://wa.me/2348118618722?text=Hi%20OMK%2C%20I%20want%20to%20order%20the%20Wolfline%20Tank%20Top">
  <span class="dot"></span>
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
  <span>Chat with us</span>
</a>

<script>
const sizes=document.querySelectorAll('.size');
sizes.forEach(btn=>{
  btn.addEventListener('click',()=>{
    sizes.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

let cart=JSON.parse(localStorage.getItem('omkCart')||'[]');
updateCart();

function addToCart(){
  const size=document.querySelector('.size.active')?.textContent||'M';
  cart.push({name:`Wolfline Tank Top (${size})`,price:55000});
  localStorage.setItem('omkCart',JSON.stringify(cart));
  updateCart();
}

function updateCart(){
  const count=document.getElementById('cartCount');
  count.textContent=cart.length;
  count.style.display=cart.length?'flex':'none';
}

document.getElementById('addToCart').onclick=addToCart;
</script>

</body>
</html>
