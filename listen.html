<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday Vibe Playlist</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:#0b0b0f;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.wrap{
  width:100%;
  max-width:420px;
  padding:20px;
}

.card{
  background:#121218;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.hero img{
  width:100%;
  display:block;
}

.content{
  padding:20px;
}

h1{
  margin:0 0 6px;
  font-size:24px;
}

p{
  margin:0 0 20px;
  color:#9aa0b2;
}

.buttons{
  display:grid;
  gap:14px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:16px;
  border-radius:14px;
  font-weight:700;
  text-decoration:none;
}

.spotify{
  background:#1DB954;
  color:#000;
}

.apple{
  background:#ff2d55;
  color:#fff;
}

footer{
  text-align:center;
  margin-top:14px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="hero">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/e8276376-add6-461f-90a3-7da501d2a6c7.jpeg">
    </div>

    <div class="content">
      <h1>Everyday Vibe Playlist</h1>
      <p>Pick where you want to listen.</p>

      <div class="buttons">

        <a class="btn spotify"
           href="https://open.spotify.com/playlist/1Ox7VYqq4rFq1gYPPRP8Fh"
           target="_blank">
          Spotify
        </a>

        <a class="btn apple"
           href="https://music.apple.com/ng/playlist/active-vibe/pl.u-DdAN8l3TN2ANagg"
           target="_blank">
          Apple Music
        </a>

      </div>
    </div>

  </div>

  <footer>
    © 2026 Everyday Vibe
  </footer>
</div>

</body>
</html>
