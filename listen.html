<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Everyday Vibe | Listen</title>
  <meta name="theme-color" content="#0b0b10" />
  <style>
    :root{
      --bg:#0b0b10;
      --panel:rgba(18,18,24,.92);
      --line:rgba(255,255,255,.10);
      --ink:#f6f7fb;
      --muted:rgba(246,247,251,.70);
      --spotify:#1DB954;
      --apple:#ff2d55;
      --radius:22px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      background:
        radial-gradient(900px 520px at 20% -10%, rgba(255,45,85,.25), transparent 60%),
        radial-gradient(900px 520px at 120% 30%, rgba(29,185,84,.20), transparent 55%),
        var(--bg);
      color:var(--ink);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:26px 16px;
    }
    .wrap{
      width:100%;
      max-width:440px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 28px 90px rgba(0,0,0,.65);
    }
    .hero{
      position:relative;
      padding:18px;
      border-bottom:1px solid var(--line);
    }
    .hero img{
      width:100%;
      height:300px;
      object-fit:cover;
      border-radius:20px;
      display:block;
      filter:saturate(1.05);
    }
    .brand{
      padding:16px 18px 0;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      font-weight:800;
      letter-spacing:.6px;
      font-size:12px;
      text-transform:uppercase;
    }
    h1{
      margin-top:12px;
      font-size:24px;
      font-weight:950;
      letter-spacing:.2px;
    }
    p{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
      line-height:1.35;
    }
    .actions{
      padding:18px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .btn{
      border:none;
      border-radius:16px;
      padding:16px 14px;
      font-weight:950;
      font-size:15px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition:transform .12s ease, filter .12s ease;
      user-select:none;
    }
    .btn:active{transform:scale(.98)}
    .btn img{width:22px;height:22px}
    .spotify{background:var(--spotify); color:#06110a}
    .apple{background:var(--apple); color:#fff}
    .footer{
      padding:14px 18px 18px;
      text-align:center;
      color:rgba(246,247,251,.55);
      font-size:12px;
      border-top:1px solid var(--line);
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="hero">
      <img
        src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/e8276376-add6-461f-90a3-7da501d2a6c7.jpeg"
        alt="Everyday Vibe"
      />
    </section>

    <section class="brand">
      <div class="pill">EVERYDAY VIBE • LISTEN</div>
      <h1>Pick a platform</h1>
      <p>Choose where you want to listen. Nothing else.</p>
    </section>

    <section class="actions">
      <button class="btn spotify" onclick="go(SPOTIFY_LINK)">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/spotify.png" alt="Spotify" onerror="this.style.display='none'">
        Spotify
      </button>

      <button class="btn apple" onclick="go(APPLE_LINK)">
        <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/apple.png" alt="Apple Music" onerror="this.style.display='none'">
        Apple Music
      </button>
    </section>

    <div class="footer">© 2026 Everyday Vibe</div>
  </main>

  <script>
    // ✅ EDIT ONLY THESE TWO LINKS
    const SPOTIFY_LINK = "PASTE_SPOTIFY_PLAYLIST_OR_SONG_LINK_HERE";
    const APPLE_LINK   = "PASTE_APPLE_MUSIC_PLAYLIST_OR_SONG_LINK_HERE";

    function go(url){
      if(!url || url.includes("PASTE_")){
        alert("Add your Spotify/Apple links inside the code first.");
        return;
      }
      window.location.href = url;
    }
  </script>
</body>
</html>
