<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Everyday Vibe | Listen</title>
  <meta name="theme-color" content="#0b0b10" />

  <!-- SPEED BOOST -->
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="//raw.githubusercontent.com">

  <style>
    :root{
      --bg:#0b0b10;
      --panel:rgba(18,18,24,.92);
      --line:rgba(255,255,255,.10);
      --ink:#f6f7fb;
      --muted:rgba(246,247,251,.70);
      --spotify:#1DB954;
      --apple:#ff2d55;
      --radius:22px;
    }
    *{box-sizing:border-box;margin:0;padding:0}

    body{
      min-height:100vh;
      background:
        radial-gradient(900px 520px at 20% -10%, rgba(255,45,85,.18), transparent 60%),
        radial-gradient(900px 520px at 120% 30%, rgba(29,185,84,.15), transparent 55%),
        var(--bg);
      color:var(--ink);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px 14px;
    }

    .wrap{
      width:100%;
      max-width:440px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 22px 70px rgba(0,0,0,.55);
    }

    .hero{
      padding:14px;
      border-bottom:1px solid var(--line);
    }

    .hero img{
      width:100%;
      height:240px; /* reduced height for speed */
      object-fit:cover;
      border-radius:18px;
      display:block;
      background:#111;
    }

    .brand{
      padding:16px 18px 0;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      font-weight:800;
      letter-spacing:.6px;
      font-size:12px;
      text-transform:uppercase;
    }

    h1{
      margin-top:12px;
      font-size:24px;
      font-weight:950;
      letter-spacing:.2px;
    }

    p{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
      line-height:1.35;
    }

    .actions{
      padding:18px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .btn{
      border:none;
      border-radius:16px;
      padding:16px 14px;
      font-weight:950;
      font-size:15px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition:transform .12s ease, filter .12s ease;
      user-select:none;
    }

    .btn:active{transform:scale(.98)}

    .btn svg{
      width:20px;
      height:20px;
    }

    .spotify{background:var(--spotify); color:#06110a}
    .apple{background:var(--apple); color:#fff}

    .footer{
      padding:14px 18px 18px;
      text-align:center;
      color:rgba(246,247,251,.55);
      font-size:12px;
      border-top:1px solid var(--line);
    }

    @media(max-width:360px){
      .actions{grid-template-columns:1fr;}
    }
  </style>
</head>

<body>
  <main class="wrap">

    <section class="hero">
      <img
        src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/e8276376-add6-461f-90a3-7da501d2a6c7.jpeg"
        alt="Everyday Vibe"
        loading="lazy"
        decoding="async"
      />
    </section>

    <section class="brand">
      <div class="pill">EVERYDAY VIBE • LISTEN</div>
      <h1>Pick a platform</h1>
      <p>Choose where you want to listen. Nothing else.</p>
    </section>

    <section class="actions">

      <button class="btn spotify" onclick="go(SPOTIFY_LINK)">
        <!-- SVG instead of image (faster) -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 
          10-4.48 10-10S17.52 2 12 2Zm4.6 14.5c-.2.3-.6.4-.9.2
          -2.3-1.4-5.2-1.7-8.7-.9-.3.1-.7-.1-.8-.5
          -.1-.3.1-.7.5-.8 3.8-.9 7-.5 9.6 1.1.3.2.4.6.3.9Zm1.2-2.7
          c-.3.4-.8.5-1.1.3-2.7-1.6-6.7-2.1-9.9-1.1
          -.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1
          3.6-1.1 8.1-.6 11.1 1.3.4.2.5.7.4 1Zm.1-2.8
          c-3.2-1.9-8.5-2.1-11.5-1.2-.5.2-1-.1-1.1-.6
          -.2-.5.1-1 .6-1.1 3.5-1 9.3-.8 13 1.4.5.3.6.9.3 1.4
          -.3.5-.9.6-1.3.3Z"/>
        </svg>
        Spotify
      </button>

      <button class="btn apple" onclick="go(APPLE_LINK)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16.4 12.4c0 2.2 1.9 2.9 2 2.9
          0 .1-.3 1-.9 2-.6.9-1.3 1.8-2.2 1.8
          -.9 0-1.2-.6-2.3-.6s-1.4.6-2.3.6
          c-.9 0-1.6-.9-2.2-1.8-1.2-1.8-2.2-5-.9-7.2
          .6-1.1 1.7-1.8 2.9-1.8.9 0 1.8.6 2.3.6
          .5 0 1.5-.7 2.6-.6.4 0 1.7.2 2.5 1.3
          -.1.1-1.5.9-1.5 2.8Zm-1.4-6.6c.5-.6.8-1.4.7-2.2
          -.7 0-1.6.5-2.1 1.1-.5.5-.9 1.3-.8 2.1
          .8.1 1.6-.4 2.2-1Z"/>
        </svg>
        Apple Music
      </button>

    </section>

    <div class="footer">© 2026 Everyday Vibe</div>

  </main>

  <script>
    const SPOTIFY_LINK = "PASTE_SPOTIFY_PLAYLIST_OR_SONG_LINK_HERE";
    const APPLE_LINK   = "PASTE_APPLE_MUSIC_PLAYLIST_OR_SONG_LINK_HERE";

    function go(url){
      if(!url || url.includes("PASTE_")){
        alert("Add your Spotify/Apple links inside the code first.");
        return;
      }
      window.location.href = url;
    }
  </script>
</body>
</html>
