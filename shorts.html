<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OMK Wolf Sigil Shorts 🐺 | Only My Kind</title>

<style>
:root{
  --bg:#ffffff;--text:#101010;--muted:#6b7280;--border:#e5e7eb;--accent:#111;--shadow:0 10px 30px rgba(0,0,0,.06);--omk:#ff2d55;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;backdrop-filter:blur(8px)}
.brand{font-weight:900;font-size:20px}
.h-icons{display:flex;gap:14px;align-items:center}
.h-icons img{width:24px;height:24px;cursor:pointer}

/* CART ICON */
.cart-btn{position:relative}
.cart-count{position:absolute;top:-4px;right:-6px;background:var(--omk);color:#fff;font-size:11px;font-weight:700;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}

/* MENU DRAWER */
.menu-drawer{position:fixed;top:0;right:-100%;width:100%;max-width:300px;height:100%;background:#fff;z-index:200;transition:.4s;padding:30px 24px;box-shadow:-5px 0 20px rgba(0,0,0,.08)}
.menu-drawer.open{right:0}
.menu-close{position:absolute;right:18px;top:16px;font-size:24px;cursor:pointer}
.menu-drawer a{display:block;padding:10px 0;font-weight:700;color:#000}

/* PAGE */
.wrap{max-width:1100px;margin:32px auto;padding:0 16px}
.grid{display:grid;gap:34px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

/* PRODUCT CARD */
.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.gallery{display:flex;flex-direction:column;gap:16px}
.gallery img{width:100%;border-radius:14px;border:1px solid var(--border);object-fit:contain}
.title{font-size:28px;font-weight:900}
.desc{color:var(--muted);line-height:1.7;margin-bottom:14px}
.price{font-weight:900;font-size:20px;margin-bottom:18px}
.sizes{display:flex;gap:10px}
.size{padding:10px 16px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-weight:800;background:#fff}
.size.active{background:#111;border-color:#111;color:#fff}
.btns{display:flex;gap:12px;margin-top:14px}
.btn{padding:14px 18px;border-radius:12px;border:1px solid var(--border);cursor:pointer;font-weight:900}
.btn.primary{background:#111;color:#fff}

/* CART PANEL */
.cart-panel{position:fixed;left:0;right:0;bottom:-100%;background:#fff;border-top:2px solid var(--border);transition:.4s;padding:20px 18px;border-radius:18px 18px 0 0;z-index:150}
.cart-panel.open{bottom:0}
.cart-item{display:flex;justify-content:space-between;margin-bottom:8px}
.cart-total{text-align:right;font-weight:800;margin-top:10px}
.cart-actions a{background:var(--omk);color:#fff;padding:10px 15px;border-radius:10px;font-weight:800;display:inline-block}

/* FOOTER */
footer{text-align:center;margin:60px 0 90px;color:var(--muted);font-weight:600}
</style>
</head>

<body>

<header class="header">
  <div class="brand"><a href="index.html">OMK</a></div>
  <div class="h-icons">
    <div id="cartBtn" class="cart-btn"><img src="https://cdn-icons-png.flaticon.com/512/3737/3737151.png"><div id="cartCount" class="cart-count" style="display:none">0</div></div>
    <img id="menuBtn" src="https://cdn-icons-png.flaticon.com/512/56/56763.png">
  </div>
</header>

<div id="menuDrawer" class="menu-drawer">
  <span id="menuClose" class="menu-close">✕</span>
  <h3>Menu</h3>
  <a href="index.html">Shop</a>
  <a href="products.html">All Products</a>
  <a href="collections.html">Collections</a>
  <a href="about.html">About</a>
</div>

<main class="wrap">
<section class="grid">

<div class="card">
<div class="gallery">
<img src="https://raw.githubusercontent.com/omk-store/omk-website/main/1F7DF10D-60F8-436E-8B79-C5E64F6C7576.png" alt="Front">
<img src="https://raw.githubusercontent.com/omk-store/omk-website/main/5CB390F1-C296-439F-A95B-32679E9FE8BA.png" alt="Back">
</div>
</div>

<div class="card">
<div class="title">OMK Wolf Sigil Shorts 🐺</div>
<div class="desc">Chrome wolf sigil shorts — premium street fit with OMK energy.</div>
<div class="price">₦60,000</div>

<div class="subtle">Size</div>
<div class="sizes">
<button class="size active">S</button>
<button class="size">M</button>
<button class="size">L</button>
<button class="size">XL</button>
</div>

<div class="btns">
<button id="addToCart" class="btn">Add to Cart</button>
<a href="checkout.html" class="btn primary">Buy Now</a>
</div>
</div>

</section>
</main>

<div id="cartPanel" class="cart-panel">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<div id="cartTotal" class="cart-total">Total: ₦0</div>
<div class="cart-actions"><a href="checkout.html">Checkout</a></div>
</div>

<footer>© 2025 OMK – Only My Kind</footer>

<script>
const sizes=document.querySelectorAll(".size");
sizes.forEach(b=>b.onclick=()=>{sizes.forEach(x=>x.classList.remove("active"));b.classList.add("active")});

let cart=JSON.parse(localStorage.getItem("omkCart")||"[]");
updateCart();

function addToCart(){
 let size=document.querySelector(".size.active").textContent;
 cart.push({name:`OMK Wolf Sigil Shorts (${size})`,price:60000});
 localStorage.setItem("omkCart",JSON.stringify(cart));
 updateCart();toggleCart();
}

function removeItem(i){cart.splice(i,1);localStorage.setItem("omkCart",JSON.stringify(cart));updateCart();}
function updateCart(){
 let items=document.getElementById("cartItems"),total=0;
 items.innerHTML="";cart.forEach((it,i)=>{total+=it.price;items.innerHTML+=`<div class="cart-item"><span>${it.name}</span><span>₦${it.price.toLocaleString()}</span><button onclick="removeItem(${i})">❌</button></div>`});
 document.getElementById("cartTotal").textContent="Total: ₦"+total.toLocaleString();
 document.getElementById("cartCount").textContent=cart.length;
 document.getElementById("cartCount").style.display=cart.length?"flex":"none";
}
function toggleCart(){document.getElementById("cartPanel").classList.toggle("open")}
document.getElementById("addToCart").onclick=addToCart;
document.getElementById("cartBtn").onclick=toggleCart;

// menu toggle
menuBtn.onclick=()=>menuDrawer.classList.add("open");
menuClose.onclick=()=>menuDrawer.classList.remove("open");
</script>

</body>
</html>
