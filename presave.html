<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Truth – Omo Taker | Listen</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top, #111, #000);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#fff;
}

.wrap{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#1a1a1a,#0f0f0f);
  border-radius:22px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  text-align:center;
}

/* COVER */
.cover{
  width:100%;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}

/* TEXT */
h1{
  font-size:24px;
  font-weight:900;
  margin-bottom:4px;
}

.artist{
  font-size:14px;
  color:#bbb;
  margin-bottom:6px;
}

.date{
  font-size:14px;
  color:#ffb703;
  margin-bottom:18px;
}

/* LOGOS */
.logos{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:22px;
}

.logos img{
  width:100%;
  max-width:110px;
  background:#000;
  padding:14px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.6);
  transition:.2s ease;
}

.logos img:hover{
  transform:scale(1.05);
}

/* BUTTONS */
.btn{
  width:100%;
  padding:16px;
  border-radius:999px;
  font-size:16px;
  font-weight:900;
  border:none;
  margin-bottom:14px;
  cursor:pointer;
}

.share{
  background:#25D366;
  color:#fff;
}

.shop{
  background:#000;
  color:#fff;
}

/* FOOTER */
.footer{
  margin-top:14px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- COVER -->
  <img 
    src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_3999.jpeg"
    class="cover"
    alt="My Truth EP Cover"
  >

  <!-- TITLE -->
  <h1>MY TRUTH – EP</h1>
  <div class="artist">Omo Taker • OMK Records</div>
  <div class="date">Out Now 🌍🐺</div>

  <!-- STREAMING LOGOS -->
  <div class="logos">

    <a href="https://open.spotify.com/album/6rrjJygYglkhT0ZNloxEym?si=AAbW9sTWQr_iWNfnl4KzhQ" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify">
    </a>

    <a href="https://music.apple.com/ng/album/my-truth/1859702027" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_Music_logo.svg" alt="Apple Music">
    </a>

    <a href="https://www.boomplay.com/share/album/121150961?srModel=COPYLINK&srList=IOS" target="_blank">
      <img src="https://static.boomplaymusic.com/buzz/img/logo.png" alt="Boomplay">
    </a>

  </div>

  <!-- WHATSAPP -->
  <button class="btn share" onclick="shareWhatsApp()">
    📲 SHARE TO WHATSAPP
  </button>

  <!-- SHOP -->
  <button class="btn shop" onclick="window.open('https://omkdrip.com','_blank')">
    🐺 JOIN MY VIP LIST – SHOP OMK
  </button>

  <div class="footer">
    © 2025 Omo Taker • OMK Records
  </div>

</div>

<script>
// WhatsApp share
function shareWhatsApp(){
  const msg="🔥 MY TRUTH EP by Omo Taker is OUT NOW! 🎧 Listen here 👉 https://omkdrip.com";
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}
</script>

</body>
</html>
