<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Truth – EP | Omo Taker</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{
  min-height:100vh;
  background:radial-gradient(circle at top,#111,#000);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#fff;
}
.wrap{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#1a1a1a,#0f0f0f);
  border-radius:22px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  text-align:center;
}
.cover{
  width:100%;
  border-radius:16px;
  margin-bottom:16px;
}
h1{font-size:24px;font-weight:900}
.artist{font-size:14px;color:#bbb;margin:6px 0}
.status{color:#00e676;margin-bottom:20px}

/* PLATFORM ICONS */
.platforms{
  display:flex;
  gap:14px;
  margin-bottom:22px;
}
.platform{
  flex:1;
  background:#000;
  border-radius:16px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform .2s ease;
}
.platform:hover{transform:translateY(-3px)}
svg{width:42px;height:42px}

/* BUTTONS */
.btn{
  width:100%;
  padding:16px;
  border-radius:999px;
  font-size:16px;
  font-weight:900;
  border:none;
  margin-bottom:14px;
}
.share{background:#25D366;color:#fff}
.shop{background:#000;color:#fff}
.footer{margin-top:14px;font-size:12px;color:#777}
</style>
</head>

<body>
<div class="wrap">

<img src="https://raw.githubusercontent.com/omk-store/omk-website/main/IMG_3999.jpeg"
     class="cover" alt="My Truth EP">

<h1>MY TRUTH – EP</h1>
<div class="artist">Omo Taker • OMK Records</div>
<div class="status">Out Now 🌍🐺</div>

<div class="platforms">

<!-- SPOTIFY -->
<div class="platform" onclick="openLink('https://open.spotify.com/album/6rrjJygYglkhT0ZNloxEym')">
<svg viewBox="0 0 168 168" fill="#1DB954">
<path d="M84 0C37.7 0 0 37.7 0 84s37.7 84 84 84 84-37.7 84-84S130.3 0 84 0zm38.4 121.3c-1.7 2.8-5.4 3.7-8.2 2-22.5-13.8-50.8-16.9-84.2-9.2-3.2.7-6.3-1.3-7-4.5-.7-3.2 1.3-6.3 4.5-7 36.3-8.3 67.4-4.8 92.4 10.6 2.8 1.7 3.7 5.4 2 8.1z"/>
</svg>
</div>

<!-- APPLE MUSIC (REAL NOTE LOGO) -->
<div class="platform" onclick="openLink('https://music.apple.com/ng/album/my-truth/1859702027')">
<svg viewBox="0 0 512 512">
<rect x="0" y="0" width="512" height="512" rx="110" fill="#FA243C"/>
<path fill="#fff" d="M346 146c-38-3-78 8-110 30V120c0-6-4-10-10-10s-10 4-10 10v226c-7-4-15-6-24-6-28 0-50 22-50 50s22 50 50 50 50-22 50-50V222c0-21 62-46 104-44 6 0 10-4 10-9s-4-10-10-11z"/>
</svg>
</div>

<!-- BOOMPLAY (REAL LOOK) -->
<div class="platform" onclick="openLink('https://www.boomplay.com/share/album/121150961')">
<svg viewBox="0 0 100 100">
<circle cx="50" cy="50" r="48" fill="#00E5FF"/>
<text x="50%" y="63%" text-anchor="middle"
      font-size="48" font-weight="900" fill="#000">B</text>
</svg>
</div>

</div>

<button class="btn share" onclick="shareWhatsApp()">📲 SHARE TO WHATSAPP</button>
<button class="btn shop" onclick="openLink('https://omkdrip.com')">
🐺 JOIN MY VIP LIST – SHOP OMK
</button>

<div class="footer">© 2025 Omo Taker • OMK Records</div>

</div>

<script>
function openLink(url){ window.open(url,'_blank'); }
function shareWhatsApp(){
  const msg="🔥 MY TRUTH EP by Omo Taker is OUT NOW!\nListen here: https://omkdrip.com";
  window.open("https://wa.me/?text="+encodeURIComponent(msg));
}
</script>
</body>
</html>
