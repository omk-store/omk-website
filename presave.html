<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Truth – EP | Omo Taker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
body{
  min-height:100vh;
  background:#000;
  padding:30px 20px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.wrap{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:26px;
  padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.9);
  text-align:center;
}
.cover{
  width:100%;
  border-radius:18px;
  margin-bottom:18px;
}
h1{
  font-size:24px;
  font-weight:900;
}
.artist{
  font-size:14px;
  color:#444;
  margin-bottom:6px;
}
.status{
  font-size:14px;
  color:#00c853;
  margin-bottom:22px;
}
.platforms{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-bottom:22px;
}
.platform{
  background:#000;
  border-radius:18px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.25s;
}
.platform:hover{transform:translateY(-3px)}
.platform img{
  width:56px;
  height:56px;
  border-radius:12px;
}
.platform.apple{
  background:#fff;
  border:1px solid #e6e6e6;
}
.youtube{
  grid-column:1/3;
  background:#ff0000;
}
.instagram{
  grid-column:1/3;
  background:#e1306c;
}
.btn{
  width:100%;
  padding:16px;
  border-radius:999px;
  font-size:16px;
  font-weight:900;
  border:none;
  margin-bottom:14px;
  cursor:pointer;
}
.share{background:#25D366;color:#fff}
.shop{background:#000;color:#fff}
.footer{
  margin-top:14px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="wrap">
  <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_3999.jpeg" class="cover">

  <h1>MY TRUTH – EP</h1>
  <div class="artist">Omo Taker • OMK Records</div>
  <div class="status">Out Now 🌍🐺</div>

  <div class="platforms">
    <!-- Spotify -->
    <div class="platform" onclick="openLink('https://open.spotify.com/album/6rrjJygYglkhT0ZNloxEym')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_4666.png">
    </div>

    <!-- Apple -->
    <div class="platform apple" onclick="openLink('https://music.apple.com/ng/album/my-truth/1859702027')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_4654.jpeg">
    </div>

    <!-- Boomplay -->
    <div class="platform" onclick="openLink('https://www.boomplay.com/share/album/121150961')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_9928.jpeg">
    </div>

    <!-- Audiomack -->
    <div class="platform" onclick="openLink('https://audiomack.com/iam_omotaker/album/my-truth-9046956')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_4698.jpeg">
    </div>

    <!-- YouTube -->
    <div class="platform youtube" onclick="openLink('https://youtu.be/7qlRs1gDnMI')">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
    </div>

    <!-- Instagram -->
    <div class="platform instagram" onclick="openLink('https://www.instagram.com/iam_omotaker')">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png">
    </div>
  </div>

  <button class="btn share" onclick="shareWhatsApp()">📲 SHARE TO WHATSAPP</button>
  <button class="btn shop" onclick="openLink('https://omkdrip.com')">🐺 SHOP OMK</button>

  <div class="footer">© 2025 Omo Taker • OMK Records</div>
</div>

<script>
function openLink(url){ window.open(url,'_blank'); }
function shareWhatsApp(){
  const msg="🔥 MY TRUTH EP by Omo Taker is OUT NOW!\n🎥 Watch the official video:\nhttps://youtu.be/7qlRs1gDnMI\n🌍 OMK Movement";
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}
</script>

</body>
</html>
