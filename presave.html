<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Truth – Omo Taker | Pre-Save</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(180deg,#e6e6e6,#bdbdbd);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.wrap{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  text-align:center;
}

/* COVER */
.cover{
  width:100%;
  border-radius:16px;
  margin-bottom:14px;
}

/* TITLE */
h1{
  font-size:22px;
  font-weight:900;
  margin-bottom:4px;
}

.artist{
  font-size:14px;
  color:#666;
  margin-bottom:8px;
}

.date{
  font-size:13px;
  color:#888;
  margin-bottom:20px;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:16px;
  border-radius:14px;
  font-size:16px;
  font-weight:900;
  border:none;
  margin-bottom:14px;
  cursor:pointer;
}

.presave{
  background:#000;
  color:#fff;
}

.listen{
  background:#ffb703;
  color:#000;
}

/* FOOTER */
.footer{
  margin-top:12px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- COVER -->
  <img 
    src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_3999.jpeg"
    class="cover"
    alt="My Truth EP Cover"
  >

  <!-- TITLE -->
  <h1>My Truth – Omo Taker</h1>
  <div class="artist">OMK • Only My Kind</div>
  <div class="date">Out December 12th, 2025 • Pre-add now</div>

  <!-- PRE-SAVE (DAPPER) -->
  <button class="btn presave" onclick="window.open('https://dvpper.lnk.to/mytruth','_blank')">
    PRE-SAVE ON STREAMING 🔥
  </button>

  <!-- AUDIOMACK -->
  <button class="btn listen" onclick="window.open('https://audiomack.com/iam_omotaker/album/my-truth-9046956?key=mytruth','_blank')">
    LISTEN ON AUDIOMACK 🎧
  </button>

  <div class="footer">
    © 2025 Omo Taker • OMK Records
  </div>

</div>

</body>
</html>
