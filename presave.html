<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Truth – Omo Taker | Listen</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top, #111, #000);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#fff;
}

.wrap{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#1a1a1a,#0f0f0f);
  border-radius:22px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  text-align:center;
}

/* COVER */
.cover{
  width:100%;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}

/* TEXT */
h1{
  font-size:24px;
  font-weight:900;
  margin-bottom:4px;
}

.artist{
  font-size:14px;
  color:#bbb;
  margin-bottom:6px;
}

.date{
  font-size:14px;
  color:#ffb703;
  margin-bottom:18px;
}

/* COUNTDOWN */
#countdown{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
}

.time-box{
  flex:1;
  background:#000;
  border-radius:12px;
  padding:10px 0;
  box-shadow:inset 0 0 10px rgba(255,255,255,.05);
}

.time-box span{
  display:block;
  font-size:22px;
  font-weight:900;
}

.time-box small{
  font-size:11px;
  color:#aaa;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:16px;
  border-radius:999px;
  font-size:16px;
  font-weight:900;
  border:none;
  margin-bottom:14px;
  cursor:pointer;
}

/* STREAMING */
.spotify{
  background:#1DB954;
  color:#000;
  box-shadow:0 10px 25px rgba(29,185,84,.5);
}

.apple{
  background:#000;
  color:#fff;
  box-shadow:0 10px 25px rgba(0,0,0,.6);
}

.boomplay{
  background:#2fd3ff;
  color:#000;
  box-shadow:0 10px 25px rgba(47,211,255,.5);
}

/* OTHER */
.share{
  background:#25D366;
  color:#fff;
}

.shop{
  background:#000;
  color:#fff;
}

/* FOOTER */
.footer{
  margin-top:14px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- COVER -->
  <img 
    src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_3999.jpeg"
    class="cover"
    alt="My Truth EP Cover"
  >

  <!-- TITLE -->
  <h1>MY TRUTH – EP</h1>
  <div class="artist">Omo Taker • OMK Records</div>
  <div class="date">Out Now 🌍🐺</div>

  <!-- COUNTDOWN (kept for style, harmless) -->
  <div id="countdown">
    <div class="time-box"><span id="days">0</span><small>DAYS</small></div>
    <div class="time-box"><span id="hours">0</span><small>HOURS</small></div>
    <div class="time-box"><span id="mins">0</span><small>MINS</small></div>
    <div class="time-box"><span id="secs">0</span><small>SECS</small></div>
  </div>

  <!-- STREAMING LINKS -->
  <button class="btn spotify" onclick="window.open('https://open.spotify.com/album/6rrjJygYglkhT0ZNloxEym?si=AAbW9sTWQr_iWNfnl4KzhQ','_blank')">
    🎧 LISTEN ON SPOTIFY
  </button>

  <button class="btn apple" onclick="window.open('https://music.apple.com/ng/album/my-truth/1859702027','_blank')">
    🍎 LISTEN ON APPLE MUSIC
  </button>

  <button class="btn boomplay" onclick="window.open('https://www.boomplay.com/share/album/121150961?srModel=COPYLINK&srList=IOS','_blank')">
    ▶️ LISTEN ON BOOMPLAY
  </button>

  <!-- WHATSAPP -->
  <button class="btn share" onclick="shareWhatsApp()">
    📲 SHARE TO WHATSAPP
  </button>

  <!-- SHOP -->
  <button class="btn shop" onclick="window.open('https://omkdrip.com','_blank')">
    🐺 JOIN MY VIP LIST – SHOP OMK
  </button>

  <div class="footer">
    © 2025 Omo Taker • OMK Records
  </div>

</div>

<script>
// Countdown kept (safe even after release)
const target = new Date("December 12, 2025 00:00:00").getTime();

setInterval(()=>{
  const now = new Date().getTime();
  const diff = target - now;

  document.getElementById("days").innerText = Math.max(0,Math.floor(diff/(1000*60*60*24)));
  document.getElementById("hours").innerText = Math.max(0,Math.floor((diff%(1000*60*60*24))/(1000*60*60)));
  document.getElementById("mins").innerText = Math.max(0,Math.floor((diff%(1000*60*60))/(1000*60)));
  document.getElementById("secs").innerText = Math.max(0,Math.floor((diff%(1000*60))/1000));
},1000);

// WhatsApp share
function shareWhatsApp(){
  const msg="🔥 MY TRUTH EP by Omo Taker is OUT NOW! 🎧 Listen here 👉 https://omkdrip.com";
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}
</script>

</body>
</html>
