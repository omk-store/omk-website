<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Truth – EP | Omo Taker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#000;
  padding:30px 20px;
  color:#000;
}

/* CINEMATIC BACK GLOW */
body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,255,255,.15), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,0,120,.18), transparent 40%);
  animation: floatGlow 12s ease-in-out infinite alternate;
  z-index:-1;
}
@keyframes floatGlow{
  from{transform:translateY(-20px)}
  to{transform:translateY(20px)}
}

/* MAIN CARD */
.wrap{
  width:100%;
  max-width:420px;
  margin:0 auto;
  background:#fff;
  border-radius:26px;
  padding:22px;
  box-shadow:
    0 0 0 6px rgba(255,255,255,.05),
    0 30px 80px rgba(0,0,0,.9);
  text-align:center;
}

/* COVER */
.cover{
  width:100%;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.6);
}

/* TEXT */
h1{
  font-size:24px;
  font-weight:900;
  margin-bottom:4px;
}
.artist{
  font-size:14px;
  color:#444;
  margin-bottom:6px;
}
.status{
  font-size:14px;
  color:#00c853;
  margin-bottom:22px;
}

/* PLATFORMS */
.platforms{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-bottom:22px;
}
.platform{
  background:#000;
  border-radius:18px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.25s ease;
}
.platform:hover{transform:translateY(-3px)}
.platform img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:12px;
}
/* APPLE */
.platform.apple{
  background:#fff;
  border:1px solid #e6e6e6;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:16px;
  border-radius:999px;
  font-size:16px;
  font-weight:900;
  border:none;
  margin-bottom:14px;
  cursor:pointer;
}
.share{background:#25D366;color:#fff}
.shop{background:#000;color:#fff}

/* FOOTER */
.footer{
  margin-top:14px;
  font-size:12px;
  color:#777;
}

/* WOLF POPUP */
#wolfPopup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:.4s ease;
}
#wolfPopup.active{
  opacity:1;
  pointer-events:auto;
}
.wolfBox{
  background:#0b0b0b;
  color:#fff;
  width:90%;
  max-width:340px;
  border-radius:22px;
  padding:26px;
  text-align:center;
}
.wolfBox h2{
  font-size:22px;
  font-weight:900;
  margin-bottom:10px;
}
.wolfBox p{
  font-size:14px;
  color:#bbb;
  margin-bottom:22px;
}
.wolfBox button{
  width:100%;
  padding:14px;
  border-radius:999px;
  border:none;
  font-weight:900;
  margin-bottom:12px;
  cursor:pointer;
}
.wolfListen{background:#00c853;color:#000}
.wolfShop{background:#fff;color:#000}
.wolfShare{background:#111;color:#fff;border:1px solid #333}
.closeWolf{
  font-size:12px;
  color:#777;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">
  <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_3999.jpeg" class="cover" alt="My Truth EP">

  <h1>MY TRUTH – EP</h1>
  <div class="artist">Omo Taker • OMK Records</div>
  <div class="status">Out Now 🌍🐺</div>

  <div class="platforms">
    <div class="platform" onclick="openLink('https://open.spotify.com/album/6rrjJygYglkhT0ZNloxEym')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_4666.png" alt="Spotify">
    </div>

    <div class="platform apple" onclick="openLink('https://music.apple.com/ng/album/my-truth/1859702027')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_4654.jpeg" alt="Apple Music">
    </div>

    <div class="platform" onclick="openLink('https://www.boomplay.com/share/album/121150961')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_9928.jpeg" alt="Boomplay">
    </div>

    <div class="platform" onclick="openLink('https://audiomack.com/iam_omotaker/album/my-truth-9046956')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_4698.jpeg" alt="Audiomack">
    </div>
  </div>

  <button class="btn share" onclick="shareWhatsApp()">📲 SHARE TO WHATSAPP</button>
  <button class="btn shop" onclick="openLink('https://omkdrip.com')">🐺 JOIN MY VIP LIST – SHOP OMK</button>

  <div class="footer">© 2025 Omo Taker • OMK Records</div>
</div>

<!-- WOLF POPUP -->
<div id="wolfPopup">
  <div class="wolfBox">
    <h2>🐺 ONLY MY KIND</h2>
    <p>You’ve been here for a bit… Ready to move like a Wolf?</p>
    <button class="wolfListen" onclick="openLink('https://open.spotify.com/album/6rrjJygYglkhT0ZNloxEym')">🎧 LISTEN AGAIN</button>
    <button class="wolfShop" onclick="openLink('https://omkdrip.com')">🔥 SHOP OMK</button>
    <button class="wolfShare" onclick="shareWhatsApp()">📲 SHARE</button>
    <div class="closeWolf" onclick="closeWolf()">Not now</div>
  </div>
</div>

<script>
function openLink(url){ window.open(url,'_blank'); }

/* ✅ ONLY LINE FIXED HERE */
function shareWhatsApp(){
  const msg="🔥 MY TRUTH EP by Omo Taker is OUT NOW! https://omkdrip.com/presave.html";
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}

// WOLF POPUP — 30 SECONDS
setTimeout(()=>{
  document.getElementById('wolfPopup').classList.add('active');
},30000);

function closeWolf(){
  document.getElementById('wolfPopup').classList.remove('active');
}
</script>

</body>
</html>
