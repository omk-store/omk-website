<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Truth – EP | Omo Taker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#000;
  overflow:hidden;
}

/* CINEMATIC BACK GLOW */
body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,255,255,.15), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,0,120,.18), transparent 40%);
  animation: floatGlow 12s ease-in-out infinite alternate;
  z-index:-1;
}

@keyframes floatGlow{
  from{transform:translateY(-20px)}
  to{transform:translateY(20px)}
}

/* MAIN CARD */
.wrap{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:26px;
  padding:22px;
  box-shadow:
    0 0 0 6px rgba(255,255,255,.05),
    0 30px 80px rgba(0,0,0,.9);
  text-align:center;
}

/* COVER */
.cover{
  width:100%;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.6);
}

/* TEXT */
h1{
  font-size:24px;
  font-weight:900;
  margin-bottom:4px;
}

.artist{
  font-size:14px;
  color:#444;
  margin-bottom:6px;
}

.status{
  font-size:14px;
  color:#00c853;
  margin-bottom:22px;
}

/* PLATFORM ICONS */
.platforms{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-bottom:22px;
}

.platform{
  background:#000;
  border-radius:18px;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.25s ease;
}

.platform:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 25px rgba(0,0,0,.6);
}

.platform img{
  width:46px;
  height:46px;
  object-fit:contain;
}

/* APPLE MUSIC – WHITE ONLY */
.platform.apple{
  background:#ffffff;
  border:1px solid #e6e6e6;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:16px;
  border-radius:999px;
  font-size:16px;
  font-weight:900;
  border:none;
  margin-bottom:14px;
  cursor:pointer;
}

.share{
  background:#25D366;
  color:#fff;
}

.shop{
  background:#000;
  color:#fff;
}

/* FOOTER */
.footer{
  margin-top:14px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- COVER -->
  <img 
    src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_3999.jpeg"
    class="cover"
    alt="My Truth EP Cover"
  >

  <!-- TITLE -->
  <h1>MY TRUTH – EP</h1>
  <div class="artist">Omo Taker • OMK Records</div>
  <div class="status">Out Now 🌍🐺</div>

  <!-- PLATFORMS -->
  <div class="platforms">

    <!-- SPOTIFY -->
    <div class="platform" onclick="window.open('https://open.spotify.com/album/6rrjJygYglkhT0ZNloxEym','_blank')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_4666.png" alt="Spotify">
    </div>

    <!-- APPLE MUSIC -->
    <div class="platform apple" onclick="window.open('https://music.apple.com/ng/album/my-truth/1859702027','_blank')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_4654.jpeg" alt="Apple Music">
    </div>

    <!-- BOOMPLAY -->
    <div class="platform" onclick="window.open('https://www.boomplay.com/share/album/121150961','_blank')">
      <img src="https://raw.githubusercontent.com/omk-store/omk-website/refs/heads/main/IMG_9928.jpeg" alt="Boomplay">
    </div>

    <!-- AUDIOMACK (FIXED + SHOWING) -->
    <div class="platform" onclick="window.open('https://audiomack.com/iam_omotaker/album/my-truth-9046956','_blank')">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Audiomack_logo_icon.svg" alt="Audiomack">
    </div>

  </div>

  <!-- WHATSAPP -->
  <button class="btn share" onclick="shareWhatsApp()">
    📲 SHARE TO WHATSAPP
  </button>

  <!-- SHOP -->
  <button class="btn shop" onclick="window.open('https://omkdrip.com','_blank')">
    🐺 JOIN MY VIP LIST – SHOP OMK
  </button>

  <div class="footer">
    © 2025 Omo Taker • OMK Records
  </div>

</div>

<script>
function shareWhatsApp(){
  const msg="🔥 MY TRUTH EP by Omo Taker is OUT NOW! Listen on Spotify, Apple Music, Boomplay & Audiomack: https://omkdrip.com";
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}
</script>

</body>
</html>
